<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="theme-color" content="#1f3556">
<title>金剛住機 スケジュール管理（試作）</title>
<style>
:root{
  --navy:#1f3556; --navy-2:#2a4670; --accent:#e8792b; --accent-d:#cf6519;
  --bg:#f4f6f9; --panel:#ffffff; --line:#e3e8ef; --line-2:#eef2f7;
  --tx:#1b2430; --tx-2:#5b6777; --tx-3:#8b95a4;
  --ok:#22a06b; --warn:#e8a020; --danger:#d94a4a; --info:#2f6fd0;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  --sh-2:0 8px 28px rgba(16,24,40,.14);
}
html[data-theme="dark"]{
  --navy:#16233a; --bg:#11151c; --panel:#1a212b; --line:#2a3441; --line-2:#232c38;
  --tx:#e8edf4; --tx-2:#a4b0c0; --tx-3:#7c8898;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--info)}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.side{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:16px}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand span{display:block;font-size:10px;color:var(--tx-3);letter-spacing:.18em}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;
  color:var(--tx-2);font-size:13.5px;text-align:left;transition:.12s}
.nav button:hover{background:var(--line-2);color:var(--tx)}
.nav button.on{background:var(--navy);color:#fff;font-weight:600}
.nav button .ic{width:18px;text-align:center;opacity:.9}
.nav button .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;
  min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.nav button.on .badge{background:#fff;color:var(--navy)}
.modesw{margin:2px 12px 8px;padding:4px;background:var(--line-2);border-radius:11px;display:flex;gap:3px}
.modesw button{flex:1;padding:7px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--tx-2)}
.modesw button.on{background:var(--panel);color:var(--navy);box-shadow:var(--sh)}
html[data-theme="dark"] .modesw button.on{color:var(--tx)}
.mesel{margin:0 12px 10px;display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);
  border-radius:11px;background:var(--panel)}
.mesel select{flex:1;min-width:0;border:none;background:none;outline:none;font-weight:700;font-size:13.5px}
.meband{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;
  background:linear-gradient(90deg,rgba(232,121,43,.10),transparent);border:1px solid var(--line)}
.meband b{font-size:14px}
.tl{display:flex;flex-direction:column;gap:0}
.tlrow{display:flex;gap:12px}
.tlrow .tm{width:64px;flex:0 0 64px;text-align:right;font-size:12px;color:var(--tx-3);padding-top:12px}
.tlrow .ln{width:14px;flex:0 0 14px;display:flex;flex-direction:column;align-items:center}
.tlrow .ln i{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:16px}
.tlrow .ln s{flex:1;width:2px;background:var(--line);display:block}
.tlrow .bx{flex:1;min-width:0;padding:8px 0 14px}
.tlcard{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:11px;padding:11px 13px;
  background:var(--panel);cursor:pointer;box-shadow:var(--sh)}
.tlcard:hover{background:var(--line-2)}
.tlcard b{font-size:14px;display:block}
.tlcard .m{font-size:11.5px;color:var(--tx-3);margin-top:3px}
.tlmove{font-size:12px;color:var(--tx-2);background:repeating-linear-gradient(45deg,rgba(140,152,168,.16) 0 5px,transparent 5px 10px);
  border:1px dashed var(--line);border-radius:9px;padding:7px 11px}
.side-foot{margin-top:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--line);color:var(--tx-3);font-size:11.5px}
.side-foot button{width:30px;height:30px;border-radius:50%;background:var(--line-2);display:grid;place-items:center}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 22px 10px;flex-wrap:wrap;position:relative}
.titlebtn{display:flex;align-items:center;gap:9px;background:none;border:none;padding:4px 8px;margin:-4px -8px;
  border-radius:10px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.titlebtn:hover{background:var(--line-2)}
.titlebtn .caret{font-size:14px;color:var(--tx-3);margin-left:2px}
.vmenu{position:absolute;top:100%;left:16px;z-index:850;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--sh-2);padding:6px;min-width:250px;max-width:calc(100% - 32px)}
.vmenu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:none;cursor:pointer;
  padding:10px 12px;border-radius:9px;font-size:14px;color:var(--tx);text-align:left}
.vmenu button:hover{background:var(--line-2)}
.vmenu button.on{background:var(--navy);color:#fff}
.vmenu .ic{width:22px;text-align:center;font-size:15px}
.vmenu .sub{font-size:11px;opacity:.7;display:block}
.vmenu .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}
.vmenu button.on .badge{background:#fff;color:var(--navy)}
.wk th.tdy, .wk td.tdy{background:rgba(232,121,43,.10)}
.wk th.tdy{position:relative;color:var(--accent-d);font-weight:800}
.wk th.tdy::after{content:'';position:absolute;left:6px;right:6px;bottom:0;height:3px;background:var(--accent);border-radius:2px}
.wk td.tdy{box-shadow:inset 1px 0 0 var(--accent),inset -1px 0 0 var(--accent)}
.wk tbody tr:last-child td.tdy{box-shadow:inset 1px 0 0 var(--accent),inset -1px 0 0 var(--accent),inset 0 -2px 0 var(--accent)}
.wk .tdybadge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;
  padding:1px 8px;font-size:10.5px;font-weight:700;margin-left:6px;vertical-align:middle}
.rowlink2{cursor:pointer}
.rowlink2:hover{background:var(--line-2)}
.top h1{margin:0;font-size:20px;letter-spacing:.01em}
.top p{margin:2px 0 0;color:var(--tx-3);font-size:12.5px}
.top .sp{margin-left:auto}
.datenav{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.datenav button{padding:8px 12px;color:var(--tx-2)}
.datenav button:hover{background:var(--line-2)}
.datenav .d{padding:5px 16px;text-align:center;min-width:112px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.datenav .d b{display:block;font-size:16px;line-height:1.2}
.datenav .d span{display:block;font-size:10.5px;color:var(--tx-3)}
.btn{padding:9px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  font-size:13px;font-weight:600;box-shadow:var(--sh);transition:.12s}
.btn:hover{background:var(--line-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(232,121,43,.3)}
.btn.pri:hover{background:var(--accent-d)}
.btn.gh{background:transparent;box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px;box-shadow:none}
.btn.dg{color:var(--danger);border-color:#f0c9c9}
.hintbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:899;display:flex;gap:10px;
  align-items:center;justify-content:center;flex-wrap:wrap;background:var(--panel);color:var(--tx);
  border:1px solid var(--line);padding:10px 14px;border-radius:12px;box-shadow:var(--sh-2);font-size:13px}
.updbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:900;display:flex;gap:10px;
  align-items:center;justify-content:center;flex-wrap:wrap;background:var(--navy);color:#fff;
  padding:11px 14px;border-radius:12px;box-shadow:var(--sh-2);font-size:13.5px;line-height:1.5}
.updbar .btn{background:var(--accent);color:#fff;border-color:var(--accent)}
.updbar .gh{background:transparent;color:#cbd5e1;border-color:#5b6777}
a.btn.lnk{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;white-space:nowrap}
tbody tr.rowlink{cursor:pointer}
tbody tr.rowlink td:last-child{color:var(--tx-3);text-align:right;font-size:17px;width:34px}
.addr-link{color:var(--info);text-decoration:none}
.addr-link:hover{text-decoration:underline}
.body{padding:6px 22px 40px;display:flex;flex-direction:column;gap:16px}

/* ---------- cards ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--info);
  border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat .l{font-size:12px;color:var(--tx-2);display:flex;align-items:center;gap:4px}
.stat .chev{margin-left:auto;color:var(--tx-3);font-size:15px;line-height:1}
.stat.click{cursor:pointer;transition:.12s}
.stat.click:hover{background:var(--line-2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(16,24,40,.10)}
.stat.click:active{transform:none}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:12px;font-weight:600;color:var(--tx-3);margin-left:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.panel>header{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap}
.panel>header h2{margin:0;font-size:15px}
.panel>header .hint{font-size:11.5px;color:var(--tx-3)}
.panel>header .sp{margin-left:auto}
.pad{padding:0 16px 16px}
.empty{padding:34px 16px;text-align:center;color:var(--tx-3);font-size:13px}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 12px;font-size:11.5px;color:var(--tx-2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.legend .tv{position:static;width:14px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px;
  background:repeating-linear-gradient(45deg,#b9c2ce 0 3px,transparent 3px 6px);border:1px solid #cbd3dd}

/* ---------- gantt ---------- */
.gantt{overflow-x:auto;border-top:1px solid var(--line)}
.g-in{min-width:1000px}
.g-head{display:flex;border-bottom:1px solid var(--line);background:var(--line-2)}
.g-head .lead{width:190px;flex:0 0 190px;border-right:1px solid var(--line)}
.g-head .cells{display:flex;flex:1}
.g-head .cells div{flex:1;text-align:center;font-size:11.5px;color:var(--tx-3);padding:6px 0;border-left:1px solid var(--line)}
.g-row{display:flex;border-bottom:1px solid var(--line-2);min-height:70px}
.g-row:last-child{border-bottom:none}
.g-row .lead{width:190px;flex:0 0 190px;border-right:1px solid var(--line);display:flex;align-items:flex-start;
  gap:9px;padding:11px 12px}
.av{width:30px;height:30px;border-radius:9px;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 30px}
.g-row .who b{display:block;font-size:13.5px}
.g-row .cnt{margin-left:auto;text-align:right;font-size:10.5px;color:var(--tx-3);line-height:1.45;white-space:nowrap}
.track{position:relative;flex:1;background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--colw))}
.ev{position:absolute;border-radius:8px;padding:4px 7px;color:#fff;overflow:hidden;
  cursor:pointer;box-shadow:0 1px 4px rgba(16,24,40,.2);min-width:34px}
.ev b{display:block;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;font-size:10px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.tent{background:transparent!important;border:1.5px dashed #98a4b3;color:var(--tx-2)}
.ev.dup{outline:2px solid var(--danger);outline-offset:1px}
.ev.ext{background:repeating-linear-gradient(135deg,rgba(124,136,152,.18) 0 6px,rgba(124,136,152,.06) 6px 12px)!important;
  border:1.5px solid #97a2b0;color:var(--tx-2);box-shadow:none}
.g-row .lead{align-items:flex-start}
.g-row .lead .badge-dup{display:inline-block;margin-top:4px;font-size:10px;font-weight:700;color:#fff;
  background:var(--danger);border-radius:6px;padding:1px 6px;white-space:nowrap}
.g-row .who{min-width:0}
.tv{position:absolute;border-radius:5px;cursor:pointer;
  background:repeating-linear-gradient(45deg,rgba(140,152,168,.45) 0 4px,rgba(140,152,168,.13) 4px 8px);
  border:1px solid rgba(140,152,168,.5);font-size:9.5px;color:var(--tx-2);display:grid;place-items:center;overflow:hidden}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:3}
.now::before{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* ---------- generic table ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--tx-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--line-2)}

/* ---------- chips / tags ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.tag.g{background:rgba(34,160,107,.13);color:var(--ok)}
.tag.o{background:rgba(232,121,43,.14);color:var(--accent-d)}
.tag.r{background:rgba(217,74,74,.13);color:var(--danger)}
.tag.b{background:rgba(47,111,208,.12);color:var(--info)}
.tag.n{background:var(--line-2);color:var(--tx-2)}
.avs{display:flex;gap:-4px}
.avs .av{width:24px;height:24px;font-size:11px;border-radius:7px;margin-right:-5px;border:2px solid var(--panel)}
.avs .av:last-child{margin-right:0}

/* ---------- forms ---------- */
.f{display:flex;flex-direction:column;gap:5px}
.f>label{font-size:11.5px;font-weight:600;color:var(--tx-2)}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);outline:none;transition:.12s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,121,43,.14)}
.f textarea{resize:vertical;min-height:66px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hintline{font-size:11px;color:var(--tx-3)}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--tx-2);transition:.12s}
.pick button .av{width:22px;height:22px;font-size:11px;border-radius:7px;opacity:.45}
.pick button.on{border-color:var(--accent);background:rgba(232,121,43,.09);color:var(--tx);font-weight:600}
.pick button.on .av{opacity:1}
.pick.plain button{padding:6px 13px}
.pick.plain button.on{border-color:var(--navy);background:var(--navy);color:#fff}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(16,24,40,.5);backdrop-filter:blur(2px);z-index:60;
  display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--sh-2);width:100%;max-width:660px;
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:820px}
.modal>header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal>header h3{margin:0;font-size:16px}
.modal>header .x{margin-left:auto;width:32px;height:32px;border-radius:8px;color:var(--tx-3);font-size:18px}
.modal>header .x:hover{background:var(--line-2)}
.modal .content{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal>footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--line-2)}
.modal>footer .sp{margin-left:auto}
.sec{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sec>h4{margin:0;font-size:12.5px;color:var(--tx-2);display:flex;align-items:center;gap:8px}
.sec>h4 .sp{margin-left:auto}

/* ---------- todo ---------- */
.todo{display:flex;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.todo+.todo{margin-top:8px}
.todo.done{opacity:.5}
.todo .ck{width:20px;height:20px;flex:0 0 20px;border:1.8px solid var(--line);border-radius:6px;margin-top:2px;
  display:grid;place-items:center;color:#fff;font-size:12px;transition:.12s}
.todo.done .ck{background:var(--ok);border-color:var(--ok)}
.todo .bd{flex:1;min-width:0}
.todo .ttl{font-size:13.5px;font-weight:600}
.todo.done .ttl{text-decoration:line-through}
.todo .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-size:11px;color:var(--tx-3)}
.todo .acts{display:flex;gap:5px;align-items:flex-start}
.subs{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.sub{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx-2)}
.sub .ck{width:15px;height:15px;flex:0 0 15px;border-radius:4px;font-size:9px;margin:0}
.sub.done{text-decoration:line-through;opacity:.55}
.sub.done .ck{background:var(--ok);border-color:var(--ok)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--ok)}

/* ---------- week ---------- */
.wk{overflow-x:auto;border-top:1px solid var(--line)}
.wk table{min-width:920px}
.wk th{padding:8px;text-align:center;border-left:1px solid var(--line-2)}
.wk th:first-child{text-align:left;width:150px;border-left:none}
.wk th.sat{color:var(--info)} .wk th.sun{color:var(--danger)}
.wk td{border-left:1px solid var(--line-2);vertical-align:top;min-width:110px}
.wk td:first-child{border-left:none}
.wchip{display:block;width:100%;text-align:left;border-radius:7px;padding:4px 6px;color:#fff;font-size:10.5px;
  margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.wchip.tent{background:transparent!important;border:1.2px dashed #98a4b3;color:var(--tx-2)}
.wchip.ext{background:repeating-linear-gradient(135deg,rgba(124,136,152,.18) 0 6px,rgba(124,136,152,.06) 6px 12px)!important;
  border:1px solid #97a2b0;color:var(--tx-2)}

.bell{position:relative;padding:9px 12px}
.bellct{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--danger);
  color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.bellct:empty{display:none}
.pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pstep{flex:1;min-width:86px;border:1px solid var(--line);border-radius:11px;padding:9px 6px;background:var(--panel);
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.12s}
.pstep:hover{background:var(--line-2)}

<script>
/* ============================================================
   金剛住機 スケジュール管理  —  データ層
   ============================================================ */
const KEY = 'kongo_sched_v2';
const ORIGIN_DEFAULT = '山口県下関市貴船町4-1-23';

const CATS = {

const PRIOS = { '至急':'r', '高':'o', '中':'n', '低':'n' };
/* 案件パイプライン（受付→入金までの一本道）。滞留日数の既定値つき */
const STAGES = [

const STATUS = STAGE_KEYS;

const STAGE_COLOR = {'受付':'#9aa3ae','現調':'#d4a017','見積作成':'#e8792b','見積提出':'#e8a020',

const PAY_METHODS = ['振込','現金','クレジット','相殺','その他'];
const money = n => '¥' + (Number(n)||0).toLocaleString('ja-JP');
/* 住所→Googleマップ、電話番号→発信 */

/* 下関市貴船町を起点にした車移動の目安（分）。設定画面で編集可 */

  {kw:'岬之町', m:6},   {kw:'東大和町', m:7}, {kw:'南部町', m:8},

  {kw:'小月', m:30},    {kw:'吉田', m:33},    {kw:'菊川町', m:31},
  {kw:'豊田町', m:46},  {kw:'豊浦町川棚', m:35}, {kw:'豊浦町小串', m:31},
  {kw:'豊浦町', m:33},  {kw:'豊北町', m:55},  {kw:'下関市', m:20, gen:1},
  {kw:'山陽小野田', m:45}, {kw:'宇部市', m:55}, {kw:'美祢市', m:60},
  {kw:'山口市', m:70},  {kw:'長門市', m:65},  {kw:'門司区', m:26},
  {kw:'小倉北区', m:40},{kw:'小倉南区', m:46},{kw:'戸畑区', m:47},
  {kw:'八幡東区', m:52},{kw:'八幡西区', m:57},{kw:'若松区', m:55},
  {kw:'北九州市', m:45, gen:1}
];

const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const SEED_U = '2020-01-01T00:00:00.000Z';
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const WD = ['日','月','火','水','木','金','土'];
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const fmtD = s => { const d = parseD(s); return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'; };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const toHM  = m => pad(Math.floor(((m%1440)+1440)%1440/60)) + ':' + pad(((m%60)+60)%60);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));


/* ============================================================
   カテゴリー初期値（実データは同期で取り込みます）
   ============================================================ */
const GT_CATS = [
  {name:'長期ビジョンタスク',    color:'#8b5cf6'},
  {name:'急ぐ要件',              color:'#d94a4a'},
  {name:'請求',                  color:'#2f6fd0'},
  {name:'見積　作成',            color:'#e8792b'},
  {name:'工事　進行中・予定確定',color:'#22a06b'},
  {name:'工事　準備中',          color:'#17a2a2'},
  {name:'見積　回答待',          color:'#d4a017'},
  {name:'修理',                  color:'#d63384'},
  {name:'継続中案件',            color:'#6b7280'}
];
/* due は Google 側が「◯週間前」表示のため推定値。編集して調整してください */
const GT_TODOS = [];   /* 公開版：実データは含めません（同期で取り込みます） */
/* カテゴリー＆ToDoを（重複を避けて）流し込む。既存データにも一度だけ適用 */
function importGTasks(d, owner){
  GT_CATS.forEach((c,i) => { if(!d.cats.some(x => x.name === c.name)) d.cats.push({id:'gc'+(i+1), name:c.name, color:c.color}); });
  GT_TODOS.forEach((g,i) => {
    if(d.todos.some(x => x.title === g.t)) return;
    const cat = d.cats.find(c => c.name === g.c);
    d.todos.push({id:'gt'+(i+1), title:g.t, scope:'personal', jobId:'', who:[owner],
      due:g.d||'', prio:g.p||'中', done:false, cat:cat?cat.id:'', memo:'',
      subs:(g.subs||[]).map(x=>({t:x, d:false})), created:today()});
  });
  const byName = n => (d.cats.find(c => c.name === n)||{}).id || '';
  d.tpl.forEach(t => {
    if(t.name === '給湯器交換') t.cat = byName('修理');
    if(t.name === '現場調査')   t.cat = byName('見積　作成');
    if(t.name === 'リフォーム（浴室）') t.cat = byName('工事　準備中');
  });
  return d;
}

/* ---------- 初期データ ---------- */
function seed(){
  const st = [
    {id:'s1', name:'木村', full:'',          role:'', mail:'', color:'#2f6fd0', active:true},
    {id:'s2', name:'岡原', full:'',          role:'', mail:'', color:'#22a06b', active:true},
    {id:'s3', name:'福光', full:'',          role:'', mail:'', color:'#e8792b', active:true},
    {id:'s4', name:'久保', full:'',          role:'', mail:'', color:'#8b5cf6', active:true},
    {id:'s5', name:'中村', full:'',          role:'', mail:'', color:'#d63384', active:true},
    {id:'s6', name:'事務所', full:'',        role:'', mail:'', color:'#17a2a2', active:true},
    {id:'s7', name:'今村', full:'',          role:'', mail:'', color:'#0ea5e9', active:true}
  ];
  const t = today();
  const jobs = [];
  const sch = [];
  const todos = [];
  const tpl = [
    {id:'p1', name:'給湯器交換', cat:'c3', items:['現地調査・寸法確認','見積書の作成・提出','機器の発注','施工日の調整','施工','完了写真の送付','請求書の発行']},
    {id:'p2', name:'現場調査', cat:'c3', items:['お客様へ日程連絡','図面・履歴の確認','現地写真の撮影','所見メモの作成','見積へ反映']},
    {id:'p3', name:'リフォーム（浴室）', cat:'c3', items:['現調・採寸','プラン作成','見積提出','契約','着工前挨拶','施工','完了検査','引渡し']}
  ];
  return importGTasks({
    staff: st, jobs, sch, todos, tpl, cats: [], imported:'gtasks1', log: [], deposits: [], closes: [], tomb: [], rev: 0, gcal: [],
    reports: [], atd: [],
    cfg: {
      apiKey:'', origin: ORIGIN_DEFAULT, travel: TRAVEL_TABLE_DEFAULT,
      autoTravel:true, defBuffer:15, wStart:8, wEnd:19, theme:'light', keepDays:30, actor:'', gasUrl:'', gasToken:'', lastSync:'',
      admins:['s1'], lock:{jobs:true, todos:true, pays:true, sch:false}, cashDays:7,
      sla: {}, cashLimit: 100000, cal: {}, calBack: 7, calFwd: 60,
      pollSec: 30, seenAt: '', webNotify: false, mailNotify: false, mailTo: []
    }
  }, 's1');
}
/* 初期データは「一番古い更新」として扱う（他端末の実データを壊さないため） */
function markSeed(d){
  ['jobs','sch','todos','staff','cats','tpl','deposits','reports','atd'].forEach(k =>
    (d[k]||[]).forEach(r => { if(!r._u) r._u = SEED_U; }));
  return d;
}

let DB = load();
/* 受付№の発番台帳。使い始めた時点の番号を基準にして、それ以降の欠番だけを見張る */
function initSeq(d){
  if(typeof d.cfg.seqFrom === 'number' && typeof d.cfg.seqNo === 'number') return;
  const ns = (d.jobs||[]).map(j => { const m = String(j.code||'').match(/^R-(\d+)$/); return m ? +m[1] : 0; });
  const mx = ns.length ? Math.max.apply(null, ns) : 0;
  d.cfg.seqFrom = mx; d.cfg.seqNo = mx;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw){ const z = markSeed(seed()); initSeq(z); return z; }
    const d = JSON.parse(raw);
    const base = markSeed(seed());
    d.cfg = Object.assign({}, base.cfg, d.cfg||{});
    if(!d.cfg.travel || !d.cfg.travel.length) d.cfg.travel = TRAVEL_TABLE_DEFAULT;
    ['staff','jobs','sch','todos','tpl','reports','atd','cats','log','deposits','closes','tomb'].forEach(k => { if(!Array.isArray(d[k])) d[k] = base[k]||[]; });
    if(typeof d.rev !== 'number') d.rev = 0;
    if(!Array.isArray(d.gcal)) d.gcal = [];
    if(!d.cfg.cal || typeof d.cfg.cal !== 'object') d.cfg.cal = {};
    const OLD = {'手配中':'受注','対応中':'施工中'};
    d.jobs.forEach(j => {
      if(OLD[j.status]) j.status = OLD[j.status];
      if(STAGE_KEYS.indexOf(j.status) < 0) j.status = '受付';
      ['est','order','inv'].forEach(k => { if(typeof j[k] !== 'number') j[k] = 0; });
      ['invNo','invDate','due'].forEach(k => { if(typeof j[k] !== 'string') j[k] = ''; });
      if(!Array.isArray(j.owners)) j.owners = j.owner ? [j.owner] : [];
      delete j.owner;
      if(!Array.isArray(j.pays))  j.pays  = [];
      if(!Array.isArray(j.notes)) j.notes = [];
      if(!j.stageAt || typeof j.stageAt !== 'object') j.stageAt = {};
      if(!j.stageAt[j.status]) j.stageAt[j.status] = (j.created||today()) + 'T09:00:00.000Z';
    });
    if(!d.cats.length) d.cats = base.cats;
    if(d.imported !== 'gtasks1'){ d.imported = 'gtasks1'; importGTasks(d, 's1'); }
    /* 担当者の追加（同じIDで全端末に行き渡るよう、1回だけ実行） */
    if(!Array.isArray(d.cfg.admins) || !d.cfg.admins.length) d.cfg.admins = ['s1'];
    if(!d.cfg.lock || typeof d.cfg.lock !== 'object') d.cfg.lock = {jobs:true, todos:true, pays:true, sch:false};
    if(typeof d.cfg.cashDays !== 'number') d.cfg.cashDays = 7;
    initSeq(d);
    d.jobs.forEach(j => { if(j.del === undefined) j.del = false; });
    if(d.staffRev !== 'r4'){
      const rev = d.staffRev;
      d.staffRev = 'r4';
      const kw = d.staff.find(x => x.id === 's6');
      if(kw && kw.name === '川崎'){ kw.name = '事務所'; kw._u = nowISO(); }
      const k = d.staff.find(x => x.id === 's1');
      if(k && k.full === '木村 大吾'){ k.full = ''; k._u = nowISO(); }
      if(!d.staff.some(x => x.id === 's7'))
        d.staff.push({id:'s7', name:'今村', full:'', role:'', mail:'', color:'#0ea5e9', active:true, _u:nowISO()});
    }
    /* 旧形式（単一担当）からの移行 */
    d.sch.forEach(e => { if(!Array.isArray(e.who)) e.who = e.staffId ? [e.staffId] : []; });
    d.todos.forEach(t => { if(!Array.isArray(t.who)) t.who = t.staffId ? [t.staffId] : []; if(!Array.isArray(t.subs)) t.subs = [];
      if(typeof t.cat !== 'string') t.cat = ''; });
    return d;
  }catch(e){ return markSeed(seed()); }
}
/* 同期対象のコレクション */
const COLL = ['jobs','sch','todos','staff','cats','tpl','deposits','reports','atd'];
const APPEND = ['log','closes'];          // 追記のみ（idで重複排除）
let SNAP = null;                          // key -> JSON（前回保存時の内容）

/* 変更のあったレコードに更新時刻を打ち、消えたレコードは「お墓」に残す */
function stampChanges(){
  const now = nowISO();
  DB.tomb = DB.tomb || [];
  const first = (SNAP === null);
  if(first) SNAP = {};
  const seen = {};
  COLL.forEach(k => (DB[k]||[]).forEach(r => {
    if(!r.id) r.id = uid(k.slice(0,2));
    const key = k + ':' + r.id;
    seen[key] = 1;
    const cur = JSON.stringify(r, (kk,v) => (kk === '_u' || kk === '_by') ? undefined : v);
    if(SNAP[key] !== cur){
      if(!first || !r._u){ r._u = now; r._by = actor(); }
      SNAP[key] = cur;
    }
  }));
  if(!first){
    Object.keys(SNAP).forEach(key => {
      if(!seen[key]){ delete SNAP[key]; DB.tomb.push({key, at: now}); }
    });
  }
  /* 古いお墓は掃除（90日） */
  DB.tomb = DB.tomb.filter(t => daysAgo(t.at) < 90);
}
function save(){
  try{ stampChanges(); localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  if(typeof scheduleSync === 'function') scheduleSync();
}

/* ---------- 操作者と変更履歴（監査ログ） ---------- */
function actor(){ return DB.cfg.actor || ''; }
function actorName(){ const s = staffById(actor()); return s ? (s.full||s.name) : '未設定'; }
/* ---------- 権限（不正防止） ----------
   ・削除できる人を管理者だけに絞る
   ・消しても履歴と「削除済み」は必ず残る（あとから必ず追える） */
const ADMIN_DEF = ['s1'];
const LOCK_DEF  = {jobs:true, todos:true, pays:true, sch:false};
const admins    = () => (DB.cfg.admins && DB.cfg.admins.length) ? DB.cfg.admins : ADMIN_DEF;
const adminNames= () => admins().map(a => (staffById(a)||{}).name || '?').join('・');
const isAdmin   = () => admins().indexOf(actor()) >= 0;
function lockOn(k){ const L = DB.cfg.lock || {}; return (k in L) ? !!L[k] : !!LOCK_DEF[k]; }
const canDel    = k => isAdmin() || !lockOn(k);
const DEL_NAME  = {jobs:'案件', todos:'ToDo', pays:'入金の記録', sch:'予定'};
function denyDel(k){
  alert('この' + DEL_NAME[k] + 'を消せるのは管理者（' + adminNames() + '）だけです。\n\n' +
        '間違えて登録した場合は、内容を開いて「削除を依頼」を押してください。管理者に通知が届きます。');
}
function logIt(type, targetId, title, field, from, to){
  DB.log = DB.log || [];
  DB.log.push({id:uid('l'), at: nowISO(), by: actor(), byName: actorName(),
    type, targetId, title:String(title||''), field:String(field||''),
    from: from===undefined?'':String(from), to: to===undefined?'':String(to)});
  if(DB.log.length > 3000) DB.log = DB.log.slice(-3000);
}

/* ---------- 参照ヘルパ ---------- */
const staffById = id => DB.staff.find(s => s.id === id);
const jobById   = id => DB.jobs.find(j => j.id === id);
const liveJobs  = () => DB.jobs.filter(j => !j.del);       /* 削除済みを除いた案件 */
const delJobs   = () => DB.jobs.filter(j => j.del);
const reqJobs   = () => DB.jobs.filter(j => !j.del && j.delReq);
/* 受付№：欠番があれば「消された形跡」としてすぐ分かる */
/* 受付№は「R-0001」形式。発番した番号を台帳(seqNo)に記録し、
   台帳にあるのに案件が無い番号＝「アプリを通さず消された」として警告する */
const codeNo = c => { const m = String(c||'').match(/^R-(\d+)$/); return m ? +m[1] : null; };
const seqMax = () => { const ns = DB.jobs.map(j => codeNo(j.code) || 0); return ns.length ? Math.max.apply(null, ns) : 0; };
function nextCode(){
  const n = Math.max(DB.cfg.seqNo || 0, seqMax()) + 1;
  DB.cfg.seqNo = n;
  return 'R-' + String(1000 + n).slice(1);
}
function missingCodes(){
  const from = DB.cfg.seqFrom || 0, to = DB.cfg.seqNo || 0;
  if(to <= from) return [];
  const have = {}; DB.jobs.forEach(j => { const n = codeNo(j.code); if(n != null) have[n] = 1; });
  const out = [];
  for(let n = from + 1; n <= to; n++) if(!have[n]) out.push(n);
  return out;
}
const codeStr = n => 'R-' + String(1000 + n).slice(1);
const activeStaff = () => DB.staff.filter(s => s.active !== false);
const catColor = c => CATS[c] || '#9aa3ae';
/* ToDoカテゴリー */
const tcatById = id => DB.cats.find(c => c.id === id);
const tcatName = id => (tcatById(id)||{}).name || '未分類';
const tcatColor = id => (tcatById(id)||{}).color || '#9aa3ae';
function tcatTag(id){
  const c = tcatColor(id);
  return '<span class="tag" style="background:'+c+'22;color:'+c+'">'+esc(tcatName(id))+'</span>';
}

/* ---------- Googleカレンダー由来の予定（読み取り専用） ---------- */
const importedGids = () => new Set(DB.sch.filter(e => e.gid).map(e => e.gid));
function gcalEvents(date){
  const done = importedGids();
  return (DB.gcal||[]).filter(g => g.date === date && !g.allDay && !done.has(g.evId)).map(g => ({

const daysBetween = (a, b) => Math.max(0, Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000));
const nowISO = () => new Date().toISOString();
const dayOf  = iso8601 => (iso8601||'').slice(0,10);
/* 記録は世界標準時（UTC）だが、画面には端末の時刻（日本時間）で出す */
const asDate = t => { const d = new Date(t||''); return isNaN(d.getTime()) ? null : d; };
const jDay   = t => { const d = asDate(t); return d ? iso(d) : ''; };
const jTime  = t => { const d = asDate(t); return d ? pad(d.getHours())+':'+pad(d.getMinutes()) : ''; };
const jStamp = t => { const d = asDate(t); return d ? (d.getMonth()+1)+'/'+d.getDate()+' '+jTime(t) : ''; };
/* 「たった今」「◯分前」…… いつの情報かがひと目で分かるように */
function agoLabel(t){
  const d = asDate(t); if(!d) return '';
  const sec = Math.max(0, Math.round((Date.now() - d.getTime())/1000));
  if(sec < 45)   return 'たった今';
  if(sec < 3600) return Math.round(sec/60) + '分前';
  if(sec < 86400) return Math.floor(sec/3600) + '時間前';
  return Math.floor(sec/86400) + '日前';
}
function daysAgo(iso8601){
  if(!iso8601) return 0;
  return Math.floor((new Date(today()+'T00:00:00') - new Date((jDay(iso8601)||dayOf(iso8601))+'T00:00:00')) / 86400000);
}

/* ============================================================
   移動時間の算出
   ============================================================ */
const Maps = {
  loading: null, ready: false, err: '',
  load(){
    const key = (DB.cfg.apiKey||'').trim();
    if(!key) return Promise.reject(new Error('APIキーが未設定です'));
    if(this.ready) return Promise.resolve();
    if(this.loading) return this.loading;
    this.loading = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&language=ja&region=JP';
      s.async = true;
      s.onload = () => { Maps.ready = true; res(); };
      s.onerror = () => { Maps.loading = null; rej(new Error('Google Maps を読み込めませんでした（通信制限またはキー不正）')); };
      document.head.appendChild(s);
      setTimeout(() => { if(!Maps.ready){ Maps.loading = null; rej(new Error('読み込みがタイムアウトしました')); } }, 12000);
    });
    return this.loading;
  },
  distance(dest){
    return this.load().then(() => new Promise((res, rej) => {
      try{
        const svc = new google.maps.DistanceMatrixService();
        svc.getDistanceMatrix({
          origins: [DB.cfg.origin || ORIGIN_DEFAULT],
          destinations: [dest],
          travelMode: google.maps.TravelMode.DRIVING,
          unitSystem: google.maps.UnitSystem.METRIC,
          region: 'JP'
        }, (r, status) => {
          if(status !== 'OK') return rej(new Error('Maps応答: ' + status));
          const el = r.rows[0] && r.rows[0].elements[0];
          if(!el || el.status !== 'OK') return rej(new Error('経路が見つかりません（住所を確認してください）'));
          res({ min: Math.round(el.duration.value/60), km: +(el.distance.value/1000).toFixed(1), src:'Google' });
        });
      }catch(e){ rej(e); }
    }));
  }
};
/* キーワード表からの推定（オフライン・フォールバック） */
function estimateTravel(addr){
  const a = String(addr||'');
  if(!a.trim()) return null;
  let hit = null, gen = null;
  DB.cfg.travel.forEach(r => {
    if(!r.kw || a.indexOf(r.kw) < 0) return;
    if(r.gen){ if(!gen) gen = r; return; }              // 市名など広域の一致は最後の手段
    if(!hit || r.kw.length > hit.kw.length) hit = r;    // より詳細な一致を優先
  });
  hit = hit || gen;
  if(!hit) return null;
  return { min: hit.m, km: null, src: '目安表（' + hit.kw + '）' };
}
/* 統合：Google → 失敗時は目安表 */
function calcTravel(addr){
  const fb = estimateTravel(addr);
  if(!(DB.cfg.apiKey||'').trim()){
    return fb ? Promise.resolve(fb) : Promise.reject(new Error('APIキー未設定・目安表にも該当なし'));
  }
  return Maps.distance(addr).catch(err => {
    if(fb){ fb.warn = err.message; return fb; }
    throw err;
  });
}

/* ============================================================
   Googleスプレッドシート同期（Apps Script Web App 経由）
   ============================================================ */
const Sync = {
  busy:false, status:'', 
  url(){ return (DB.cfg.gasUrl||'').trim(); },
  ready(){ return !!this.url(); },
  async call(action, body){
    if(!this.ready()) throw new Error('同期URLが設定されていません');
    const res = await fetch(this.url(), {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // プリフライトを避ける
      body: JSON.stringify(Object.assign({action, token: DB.cfg.gasToken||''}, body))
    });
    const txt = await res.text();
    let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('応答が不正です（デプロイ設定をご確認ください）'); }
    return j;
  },
  payload(){
    const o = {rev: DB.rev||0, tomb: DB.tomb||[]};
    COLL.concat(APPEND).forEach(k => o[k] = DB[k]||[]);
    return o;
  },
  /* リモートの内容を、レコード単位で取り込む（新しい方を採用） */
  merge(remote){
    if(!remote) return;
    const tombAt = {};
    (DB.tomb||[]).forEach(t => { if(!tombAt[t.key] || t.at > tombAt[t.key]) tombAt[t.key] = t.at; });
    const rTomb = {};
    (remote.tomb||[]).forEach(t => { if(!rTomb[t.key] || t.at > rTomb[t.key]) rTomb[t.key] = t.at; });

    COLL.forEach(k => {
      const arr = DB[k] || (DB[k] = []);
      const byId = {}; arr.forEach(r => byId[r.id] = r);
      (remote[k]||[]).forEach(rr => {
        if(!rr || !rr.id) return;
        const key = k + ':' + rr.id, lr = byId[rr.id];
        if(!lr){
          if(tombAt[key] && tombAt[key] >= (rr._u||'')) return;   // こちらで削除済み
          arr.push(rr); byId[rr.id] = rr;
        }else if((rr._u||'') > (lr._u||'')){
          Object.keys(lr).forEach(x => { if(!(x in rr)) delete lr[x]; });
          Object.assign(lr, rr);
        }
      });
      /* 相手側で削除されたものを消す（こちらの更新のほうが新しければ残す） */
      DB[k] = arr.filter(r => {
        const at = rTomb[k + ':' + r.id];
        return !(at && at > (r._u||''));
      });
    });
    /* 追記のみのもの（履歴・締め）は id で重複排除して統合 */
    APPEND.forEach(k => {
      const arr = DB[k] || (DB[k] = []);
      const has = {}; arr.forEach(r => has[r.id || (r.month+'|'+r.at)] = 1);
      (remote[k]||[]).forEach(rr => {
        const id = rr.id || (rr.month+'|'+rr.at);
        if(!has[id]){ arr.push(rr); has[id] = 1; }
      });
      if(k === 'log') arr.sort((a,b)=>(a.at||'').localeCompare(b.at||''));
    });
    /* お墓を統合 */
    const seenT = {};
    DB.tomb = (DB.tomb||[]).concat(remote.tomb||[]).filter(t => {
      const kk = t.key + '|' + t.at;
      if(seenT[kk]) return false; seenT[kk] = 1; return daysAgo(t.at) < 90;
    });
    SNAP = null;   // 次回 save() で作り直す
  },
  /* Googleカレンダーの予定を取り込む（読み取り専用） */
  async calPull(){
    const cal = DB.cfg.cal || {};
    const cals = Object.keys(cal).filter(k => cal[k]).map(k => ({staffId:k, calId:cal[k]}));
    if(!cals.length){ DB.gcal = []; return; }
    const from = addD(today(), -(DB.cfg.calBack||7));
    const to   = addD(today(),  (DB.cfg.calFwd||60));
    const r = await this.call('calPull', {from, to, cals});
    if(!r.ok) throw new Error(r.error || 'カレンダーを読めませんでした');
    DB.gcal = r.events || [];
    DB.cfg.calAt = nowISO();
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  },
  async listCalendars(){
    const r = await this.call('listCalendars');
    if(!r.ok) throw new Error(r.error || '取得できませんでした');
    return r.calendars || [];
  },
  /* 取り込み → 統合 → 書き戻し。競合したらやり直す */
  async run(){
    for(let attempt = 0; attempt < 4; attempt++){
      const got = await this.call('pull');
      if(!got.ok) throw new Error(got.error || '取得に失敗しました');
      this.merge(got.data);
      DB.rev = got.rev || 0;
      stampChanges();
      const put = await this.call('push', {rev: DB.rev, payload: this.payload()});
      if(put.ok){ DB.rev = put.rev; DB.cfg.lastSync = nowISO();
        try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
        try{ await this.calPull(); }catch(e){ /* カレンダーは失敗しても本体は続行 */ }
        return put; }
      if(!put.conflict) throw new Error(put.error || '書き込みに失敗しました');
      /* 競合：相手が先に書いたので、取り込み直して再挑戦 */
    }
    throw new Error('他の端末と競合しました。少し待ってからもう一度お試しください。');
  }
};

const seenAt = () => DB.cfg.seenAt || '';
function notices(){
  const me = actor(), since = seenAt(), out = [];
  const mine = w => !me || (w||[]).includes(me);
  /* 案件の動き（新規受付・工程・入金など） */
  (DB.log||[]).forEach(l => {
    if(!l.at || l.at <= since) return;
    if(me && l.by === me) return;
    const isNew = l.field === '新規受付';
    out.push({at:l.at, by:l.byName||'', kind: isNew ? 'new' : 'job',
      title: isNew ? '新しい受付：' + l.title : l.title,
      sub: isNew ? '' : l.field + '　' + (l.from?l.from+' → ':'') + l.to,
      go: () => { const j = jobById(l.targetId); if(j) openJob(j.id); else go('jobs'); }});
  });
  /* 自分に割り当てられた予定 */
  (DB.sch||[]).forEach(e => {
    if(!e._u || e._u <= since) return;
    if(me && e._by === me) return;
    if(!mine(e.who)) return;
    out.push({at:e._u, by:(staffById(e._by)||{}).name||'', kind:'sch',
      title:'予定：' + e.title, sub: fmtD(e.date) + ' ' + e.start + '–' + e.end,
      go: () => openSch(e.id)});
  });
  /* 自分に割り当てられたToDo */
  (DB.todos||[]).forEach(t => {
    if(!t._u || t._u <= since || t.del || t.done) return;
    if(me && t._by === me) return;
    if(!mine(t.who)) return;
    out.push({at:t._u, by:(staffById(t._by)||{}).name||'', kind:'todo',
      title:'ToDo：' + t.title, sub: t.due ? '期限 ' + fmtD(t.due) : '',
      go: () => openTodo(t.id)});
  });
  return out.sort((a,b)=>(b.at||'').localeCompare(a.at||'')).slice(0, 60);
}

async function doSync(silent){
  if(Sync.busy || !Sync.ready()) return;
  const before = notices().length;
  Sync.busy = true; Sync.status = '同期中'; paintSync();
  try{
    await Sync.run();
    Sync.status = '同期済'; paintSync();
    if(!silent) toast('同期しました（' + jTime(DB.cfg.lastSync) + '）');
    render();
    refreshNotes(before);
  }catch(e){
    Sync.status = 'エラー'; paintSync();
    if(!silent) alert('同期に失敗しました：' + e.message);
  }
  Sync.busy = false;
}

  const el = document.getElementById('syncst'); if(!el) return;
  const ok = Sync.status === '同期済';
  el.innerHTML = Sync.ready()
    ? '<span class="tag '+(Sync.status==='エラー'?'r':ok?'g':'n')+'">' +
      (Sync.status||'未同期') + (DB.cfg.lastSync ? ' ' + jTime(DB.cfg.lastSync) : '') + '</span>'

/* 自動同期：起動時＋数十秒ごとに「更新があるか」だけ確認して、あれば取り込む */
async function checkRev(){
  if(Sync.busy || !Sync.ready() || DB.cfg.autoSync === false) return;
  try{
    const r = await Sync.call('rev');
    if(r && r.ok && Number(r.rev||0) !== Number(DB.rev||0)) await doSync(true);
    else { Sync.status = '同期済'; paintSync(); }
  }catch(e){ /* 圏外などは黙って次回 */ }
}
function startAutoSync(){
  clearInterval(startAutoSync._i);
  clearInterval(startAutoSync._f);
  if(!Sync.ready() || DB.cfg.autoSync === false){ paintSync(); return; }
  doSync(true);
  const sec = Math.max(10, Math.min(600, DB.cfg.pollSec || 30));
  startAutoSync._i = setInterval(checkRev, sec * 1000);          // 更新があるかの確認（軽い）
  startAutoSync._f = setInterval(() => doSync(true), 600000);    // 念のため10分に1回はフル同期
  if(!startAutoSync._bound){
    startAutoSync._bound = true;
    document.addEventListener('visibilitychange', () => { if(!document.hidden) checkRev(); });
    window.addEventListener('online', () => checkRev());
    window.addEventListener('focus', () => checkRev());
  }
}

/* ============================================================
   売掛・入金の計算
   ============================================================ */
const OPEN_STAGES = STAGE_KEYS.filter(k => k!=='完了' && k!=='失注');
const paidOf   = j => (j.pays||[]).reduce((a,p) => a + (Number(p.amount)||0), 0);
const balOf    = j => (Number(j.inv)||0) - paidOf(j);
/* 未請求＝完工しているのに請求書が出ていない */
const isUnbilled = j => j.status === '完工' && !(Number(j.inv) > 0);
/* 未入金＝請求済みで残高あり */
const isUnpaid   = j => (Number(j.inv) > 0) && balOf(j) > 0 && j.status !== '失注';
/* 工程に入った日 */
function stageSince(j){
  const iso8601 = (j.stageAt||{})[j.status] || (j.created||today())+'T09:00:00.000Z';
  return daysAgo(iso8601);
}
function slaOf(k){ const c = DB.cfg.sla||{}; return (c[k]!==undefined ? c[k] : stageDef(k).sla); }
const isStuck = j => OPEN_STAGES.indexOf(j.status) >= 0 && slaOf(j.status) > 0 && stageSince(j) > slaOf(j.status);
/* 入金期日からの経過日数 */
function overdueDays(j){
  if(!isUnpaid(j)) return 0;
  const base = j.due || j.invDate;
  if(!base) return 0;
  const d = Math.floor((new Date(today()+'T00:00:00') - new Date(base+'T00:00:00'))/86400000);
  return Math.max(0, d);
}
/* 現金の預り残高（集金したが会社へ未納金） */
function cashHeld(staffId){
  let sum = 0;
  liveJobs().forEach(j => (j.pays||[]).forEach(p => {
    if(p.method === '現金' && !p.depositId && (!staffId || p.collector === staffId)) sum += Number(p.amount)||0;
  }));
  return sum;
}
function cashHeldRows(){
  return activeStaff().map(s => ({s, amount: cashHeld(s.id),
    items: liveJobs().flatMap(j => (j.pays||[]).filter(p => p.method==='現金' && !p.depositId && p.collector===s.id)
      .map(p => ({j, p})))})).filter(r => r.amount > 0 || r.items.length);
}
/* 案件の絞り込み（案件責任者 or 予定/ToDoの担当） */
function jobStaff(j){
  const set = new Set(); (j.owners||[]).forEach(w => set.add(w));
  DB.sch.forEach(e => { if(e.jobId===j.id) e.who.forEach(w => set.add(w)); });
  DB.todos.forEach(t => { if(!t.del && t.jobId===j.id) (t.who||[]).forEach(w => set.add(w)); });
  return [...set];
}

/* 自分が関わる案件（予定 or ToDo に担当として入っている） */
function visibleJobs(){
  if(!isMe()) return liveJobs();
  const ids = new Set();
  DB.sch.forEach(e => { if(e.who.includes(S.me) && e.jobId) ids.add(e.jobId); });
  DB.todos.forEach(t => { if(!t.del && (t.who||[]).includes(S.me) && t.jobId) ids.add(t.jobId); });
  return liveJobs().filter(j => ids.has(j.id) || (j.owners||[]).includes(S.me));
}

   本日のボード

function viewBoard(){
  if(isMe()) return viewBoardMe();
  const d = S.date;
  const day = dayEvents(d);
  const dup = conflicts(d);
  const unassigned = liveJobs().filter(j => j.status!=='完了' && !DB.sch.some(e => e.jobId === j.id));
  const urgent = day.filter(e => { const j = jobById(e.jobId); return j && j.prio === '至急'; }).length;
  const working = new Set(); day.forEach(e => e.who.forEach(w => working.add(w)));
  const myTodo = liveTodos().filter(t => t.due && t.due <= d);

  const S0 = DB.cfg.wStart, E0 = DB.cfg.wEnd, cols = E0 - S0;
  const hours = []; for(let h=S0; h<=E0; h++) hours.push(h);

  const LANE_H = 52, LANE_GAP = 5, PAD = 9;
  const rows = activeStaff().map(s => {
    const mine = day.filter(e => e.who.includes(s.id)).sort((a,b)=>span(a).s - span(b).s || toMin(a.start)-toMin(b.start));
    const own  = mine.filter(e => !e.ext);
    const mins = own.reduce((a,e)=>a + (toMin(e.end)-toMin(e.start)), 0);
    const tmin = own.reduce((a,e)=>a + (e.out|0) + (e.back|0), 0);
    const allDay = allDayItems(d, s.id);
    /* 重なりを段に振り分ける（移動時間も含めて判定） */
    const laneEnd = [], lane = {};
    mine.forEach(e => {
      const sp = span(e);
      let i = laneEnd.findIndex(end => end <= sp.s);
      if(i < 0){ laneEnd.push(sp.e); i = laneEnd.length - 1; }
      else laneEnd[i] = sp.e;
      lane[e.id] = i;
    });
    const nLane = Math.max(1, laneEnd.length);
    const rowH = PAD*2 + nLane*LANE_H + (nLane-1)*LANE_GAP;
    /* この担当者の中で実際に時間が重なっているものだけを重複とする */
    const dupHere = new Set();
    for(let i=0;i<mine.length;i++) for(let j=i+1;j<mine.length;j++){
      const a = mine[i], b = mine[j];
      if(a.tent || b.tent) continue;
      const A = span(a), B = span(b);
      if(A.s < B.e && B.s < A.e){ dupHere.add(a.id); dupHere.add(b.id); }
    }
    const bars = mine.map(e => {
      const c = catColor(e.cat), sp = span(e), li = lane[e.id];
      const L = t => clamp(((t - S0*60) / (cols*60)) * 100, 0, 100);
      const top = PAD + li*(LANE_H + LANE_GAP);
      let h = '';
      if(e.out|0) h += '<div class="tv" style="left:'+L(sp.s)+'%;width:'+(L(sp.cs)-L(sp.s))+'%;top:'+(top+9)+'px;height:'+(LANE_H-18)+'px" title="往路 '+(e.out|0)+'分" onclick="event.stopPropagation();openSch(\''+e.id+'\')">往'+(e.out|0)+'</div>';
      if(e.back|0) h += '<div class="tv" style="left:'+L(sp.ce)+'%;width:'+(L(sp.e)-L(sp.ce))+'%;top:'+(top+9)+'px;height:'+(LANE_H-18)+'px" title="復路 '+(e.back|0)+'分" onclick="event.stopPropagation();openSch(\''+e.id+'\')">復'+(e.back|0)+'</div>';
      h += '<div class="ev'+(e.tent?' tent':'')+(e.ext?' ext':'')+(dupHere.has(e.id)?' dup':'')+'" style="left:'+L(sp.cs)+'%;width:'+Math.max(L(sp.ce)-L(sp.cs),2.2)+'%;top:'+top+'px;height:'+LANE_H+'px;'+(e.ext?'':'background:'+c)+'" ' +
        'onclick="'+(e.ext?'openExt(\''+e.id+'\')':'openSch(\''+e.id+'\')')+'" title="'+esc(e.title)+' / '+e.start+'–'+e.end+' / '+esc(whoNames(e.who))+'">' +
        '<b>'+(e.ext?'📅 ':'')+esc(e.title)+'</b><span>'+e.start+'–'+e.end+(e.who.length>1?' ・'+e.who.length+'名':'')+'</span></div>';
      return h;
    }).join('');
    const nowBar = (d === today()) ? nowLine(S0, cols) : '';
    const myDup = dupHere.size;
    return '<div class="g-row" style="min-height:'+rowH+'px"><div class="lead">' + avatar(s) +
      '<div class="who"><b>'+esc(s.name)+'</b>' +
        (myDup ? '<br><span class="badge-dup">重複 '+myDup+'件</span>' : '') +
        (allDay.length ? '<br>' + allDay.slice(0,2).map(x =>
          '<span class="tag n" style="font-size:9.5px;cursor:pointer" onclick="'+(x.ext?'openExt(\''+x.id+'\')':'openSch(\''+x.id+'\')')+'" title="'+esc(x.title)+'">' +
          (x.ext?'📅 ':'●')+esc(x.title.slice(0,10))+'</span>').join(' ') + (allDay.length>2?'<span class="tag n" style="font-size:9.5px">他'+(allDay.length-2)+'</span>':'') : '') + '</div>' +
      '<div class="cnt">'+own.length+'件<br>'+(mins/60).toFixed(mins%60?1:0)+'h'+(tmin?'<br><span style="color:var(--tx-3)">移動'+tmin+'分</span>':'')+
        (nLane>1?'<br><span style="color:var(--danger)">'+nLane+'段</span>':'')+'</div></div>' +
      '<div class="track" style="--colw:'+(100/cols)+'%">'+bars+nowBar+'</div></div>';
  }).join('');

  document.getElementById('body').innerHTML =
    '<div class="stats">' +
      stat('本日の案件', day.filter(e=>!e.ext).length, '件', 'var(--info)', 'day') +
      stat('本日の至急', urgent, '件', urgent?'var(--danger)':'var(--ok)', 'urgent') +
      stat('未割り当て', unassigned.length, '件', unassigned.length?'var(--accent)':'var(--ok)', 'unassigned') +
      stat('時間の重複', dup.size, '件', dup.size?'var(--danger)':'var(--ok)', 'dup') +
      stat('稼働人数', working.size, '/'+activeStaff().length+'名', 'var(--ok)', 'staff') +
      stat('未完了ToDo', myTodo.length, '件', myTodo.length?'var(--warn)':'var(--ok)', 'todo') +
    '</div>' +

    '<section class="panel"><header><h2>ディスパッチボード</h2>' +
      '<span class="hint">帯をタップで詳細／斜線は移動時間／重なった予定は段を分けて表示</span>' +
      '<div class="sp"></div><button class="btn sm" onclick="openSch()">＋ 予定</button></header>' +
      '<div class="legend">' + Object.keys(CATS).map(k => '<span><i style="background:'+CATS[k]+'"></i>'+k+'</span>').join('') +
        '<span><i style="background:transparent;border:1.4px dashed #98a4b3"></i>仮予定</span>' +
        '<span><span class="tv"></span>移動時間</span>' +
        (hasCal() ? '<span><i style="background:transparent;border:1.4px solid #7c8898"></i>📅 Googleカレンダー</span>' : '') + '</div>' +
      '<div class="gantt"><div class="g-in">' +
        '<div class="g-head"><div class="lead"></div><div class="cells">' +
          hours.slice(0,-1).map(h => '<div>'+h+'</div>').join('') + '</div></div>' +
        (rows || '<div class="empty">担当者が登録されていません</div>') +
      '</div></div></section>' +

    alertPanel() +
    '<section class="panel"><header><h2>未割り当ての受付</h2>' +
      '<span class="hint">電話で入った相談。担当と時間を決めてボードへ</span></header>' +
      (unassigned.length ? '<div class="pad">' + unassigned.map(j =>
        '<div class="todo rowlink2" onclick="openJob(\''+j.id+'\')" title="タップして開く"><div class="bd"><div class="ttl">'+esc(j.customer)+' — '+esc(j.title)+'</div>' +
        '<div class="meta"><span class="tag '+(PRIOS[j.prio]||'n')+'">'+esc(j.prio)+'</span>' +
        '<span class="tag n" style="background:'+catColor(j.cat)+'22;color:'+catColor(j.cat)+'">'+esc(j.cat)+'</span>' +
        '<span>'+esc(j.address||'住所未登録')+'</span></div></div>' +
        '<div class="acts" onclick="event.stopPropagation()">' +
        '<button class="btn sm pri" onclick="openSch(null,\''+j.id+'\')">予定を作る</button></div></div>').join('') + '</div>'
        : '<div class="empty">未割り当ての受付はありません</div>') +
    '</section>' +

    '<section class="panel"><header><h2>本日までのToDo</h2>' +
      '<div class="sp"></div><button class="btn sm" onclick="go(\'todo\')">すべて表示</button></header>' +
      (myTodo.length ? '<div class="pad">' + myTodo.slice(0,6).map(todoRow).join('') + '</div>'
        : '<div class="empty">期限内のToDoはありません</div>') +
    '</section>';
}
/* ---------- 担当者別：1日のタイムライン ---------- */
function viewBoardMe(){
  const d = S.date, me = meStaff();
  const list = dayEvents(d).filter(e => e.who.includes(S.me)).sort((a,b)=>toMin(a.start)-toMin(b.start));
  const own  = list.filter(e => !e.ext);
  const dup = conflicts(d);
  const work = own.reduce((a,e)=>a + (toMin(e.end)-toMin(e.start)), 0);
  const mv   = own.reduce((a,e)=>a + (e.out|0) + (e.back|0), 0);
  const first = own[0], last = own[own.length-1];

      (e.note ? '<div class="m">'+esc(e.note)+'</div>' : '') + '</div>');
    if(e.back|0) h += tlRow(e.end, '<div class="tlmove">🚗 現場 → 帰社　'+(e.back|0)+'分</div>');
    return h;
  }).join('');

  document.getElementById('body').innerHTML =
    '<div class="meband">' + avatar(me) + '<div><b>'+esc((me||{}).full||(me||{}).name||'')+'</b>' +
      '<div style="font-size:11.5px;color:var(--tx-3)">'+fmtD(d)+
      (atd && atd.type!=='出勤' ? '　<span class="tag b">'+esc(atd.type)+'</span>' : '')+'</div></div>' +
      '<div class="sp" style="margin-left:auto"></div>' +
      '<button class="btn sm" onclick="openSch(null,null,\''+d+'\',\''+S.me+'\')">＋ 予定</button>' +
      '<button class="btn sm" onclick="openTodo()">＋ ToDo</button></div>' +
    '<div class="stats">' +
      stat('本日の予定', own.length, '件', 'var(--info)', 'day') +
      stat('作業時間', (work/60).toFixed(work%60?1:0), 'h', 'var(--ok)', 'day') +
      stat('移動時間', mv, '分', mv?'var(--warn)':'var(--ok)', 'move') +
      stat('拘束時間', bind ? (bind/60).toFixed(bind%60?1:0) : 0, 'h', 'var(--navy)', 'day') +
      stat('未完了ToDo', td.length, '件', td.length?'var(--warn)':'var(--ok)', 'todo') +
    '</div>' +
    (allDayItems(d, S.me).length ? '<div class="hintline" style="padding:0 2px">' +
       allDayItems(d, S.me).map(x => '<span class="tag n" style="cursor:pointer" onclick="'+(x.ext?'openExt(\''+x.id+'\')':'openSch(\''+x.id+'\')')+'">'+(x.ext?'📅 ':'')+'終日：'+esc(x.title)+'</span>').join(' ') + '</div>' : '') +
    '<section class="panel"><header><h2>'+fmtD(d)+' の予定</h2>' +
      '<span class="hint">移動時間を含めた1日の流れ（📅 はGoogleカレンダー）</span></header>' +
      (list.length ? '<div class="pad"><div class="tl">' + rows + '</div></div>'
        : '<div class="empty">この日の予定はありません</div>') +
    '</section>' +
    '<section class="panel"><header><h2>自分のToDo（本日まで）</h2><div class="sp"></div>' +
      '<button class="btn sm" onclick="go(\'todo\')">すべて表示</button></header>' +
      (td.length ? '<div class="pad">' + td.map(todoRow).join('') + '</div>'
        : '<div class="empty">期限内のToDoはありません</div>') +
    '</section>';
}

function conflictPairs(date){
  const list = dayEvents(date).filter(e => !e.tent && !e.allDay);
  const pairs = [];
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const a = list[i], b = list[j];
    const shared = a.who.filter(w => b.who.includes(w));
    if(!shared.length) continue;
    const A = span(a), B = span(b);
    if(A.s < B.e && B.s < A.e) pairs.push({a, b, who: shared});
  }
  return pairs;
}
function evRow(e, extra){
  const c = e.ext ? '#97a2b0' : catColor(e.cat);
  return '<div class="todo" style="border-left:3px solid '+c+'">' +

      '<span class="tag n">'+(e.allDay?'終日':e.start+'–'+e.end)+'</span>' +
      '<span class="tag n" style="background:'+c+'22;color:'+c+'">'+esc(e.cat)+'</span>' +
      avatars(e.who) +
      (((e.out|0)||(e.back|0)) ? '<span class="tag n">移動 往'+(e.out|0)+'／復'+(e.back|0)+'分</span>' : '') +
      (e.address ? '<span>📍'+esc(e.address)+'</span>' : '') +
      (extra||'') +
    '</div></div>' +
    '<div class="acts"><button class="btn sm" onclick="closeM();' +
      (e.ext ? 'openExt(\''+e.id+'\')' : 'openSch(\''+e.id+'\')') + '">開く</button></div></div>';
}
function openStat(kind){
  const d = S.date, t0 = today();
  const mineOnly = a => isMe() ? a.filter(e => (e.who||[]).includes(S.me)) : a;
  let title = '', body = '', foot = '';

  if(kind === 'day' || kind === 'move'){
    let list = mineOnly(dayEvents(d)).concat(DB.sch.filter(e => e.allDay && e.date <= d && (e.endDate||e.date) >= d && (!isMe() || e.who.includes(S.me))));
    if(kind === 'move') list = list.filter(e => (e.out|0) || (e.back|0));
    list.sort((a,b)=>toMin(a.start)-toMin(b.start));
    title = kind === 'move' ? fmtD(d) + ' の移動' : fmtD(d) + ' の予定（' + list.length + '件）';
    body = list.length ? list.map(e => evRow(e,
      kind === 'move' && !e.allDay
        ? '<span class="tag o">'+toHM(toMin(e.start)-(e.out|0))+' 出発 → '+toHM(toMin(e.end)+(e.back|0))+' 帰社</span>' : '')).join('')
      : '<div class="empty">この日の予定はありません</div>';
    foot = '<button class="btn" onclick="closeM();openSch(null,null,\''+d+'\''+(isMe()?',\''+S.me+'\'':'')+')">＋ 予定を追加</button>';

  }else if(kind === 'urgent'){
    const list = mineOnly(dayEvents(d)).filter(e => { const j = jobById(e.jobId); return j && j.prio === '至急'; });
    title = fmtD(d) + ' の至急案件（' + list.length + '件）';
    body = list.length ? list.map(e => evRow(e, '<span class="tag r">至急</span>')).join('')
      : '<div class="empty">至急の案件はありません</div>';

  }else if(kind === 'unassigned'){
    const list = visibleJobs().filter(j => j.status!=='完了' && j.status!=='失注' && !DB.sch.some(e => e.jobId === j.id));
    title = '未割り当ての受付（' + list.length + '件）';
    body = list.length ? list.map(j =>
      '<div class="todo" style="border-left:3px solid var(--accent)"><div class="bd">' +
      '<div class="ttl">'+esc(j.customer)+' — '+esc(j.title)+'</div><div class="meta">' +
      '<span class="tag '+(PRIOS[j.prio]||'n')+'">'+esc(j.prio)+'</span>' +
      '<span class="tag n" style="background:'+catColor(j.cat)+'22;color:'+catColor(j.cat)+'">'+esc(j.cat)+'</span>' +
      '<span class="tag n">'+esc(j.status)+'</span>' +
      (j.address?'<span>📍'+esc(j.address)+'</span>':'') + '</div></div>' +
      '<div class="acts"><button class="btn sm" onclick="closeM();openJob(\''+j.id+'\')">編集</button>' +
      '<button class="btn sm pri" onclick="closeM();openSch(null,\''+j.id+'\')">予定を作る</button></div></div>').join('')
      : '<div class="empty">未割り当ての受付はありません</div>';

  }else if(kind === 'dup'){
    const pairs = conflictPairs(d);
    title = fmtD(d) + ' の時間の重複（' + pairs.length + '組）';
    body = pairs.length
      ? '<div class="hintline">移動時間を含めて重なっています。どちらかの時間か担当を変えてください。</div>' +
        pairs.map(p =>
          '<div class="sec" style="border-color:#f0c9c9"><h4 style="color:var(--danger)">' +
          esc(whoNames(p.who)) + ' さんの予定が重なっています</h4>' +
          evRow(p.a) + evRow(p.b) + '</div>').join('')
      : '<div class="empty">重複はありません 👍</div>';

  }else if(kind === 'staff'){
    const day = dayEvents(d);
    title = fmtD(d) + ' の稼働状況';
    body = activeStaff().map(s0 => {
      const mine = day.filter(e => e.who.includes(s0.id));
      const own = mine.filter(e => !e.ext);
      const mins = own.reduce((a,e)=>a+(toMin(e.end)-toMin(e.start)),0);
      const mv = own.reduce((a,e)=>a+(e.out|0)+(e.back|0),0);
      const off = DB.atd.find(a => a.date===d && a.who===s0.id && a.type!=='出勤');
      const ad = allDayItems(d, s0.id);
      return '<div class="todo"><div class="bd"><div class="ttl">'+avatar(s0)+'　'+esc(s0.name)+'</div>' +
        '<div class="meta">' +
        (off ? '<span class="tag b">'+esc(off.type)+'</span>'
             : (mine.length || ad.length) ? '<span class="tag g">稼働中</span>' : '<span class="tag n">空き</span>') +
        ad.map(x => '<span class="tag n">'+(x.ext?'📅 ':'')+'終日：'+esc(x.title)+'</span>').join('') +
        '<span class="tag n">'+own.length+'件</span>' +
        (mins?'<span class="tag n">作業 '+(mins/60).toFixed(mins%60?1:0)+'h</span>':'') +
        (mv?'<span class="tag n">移動 '+mv+'分</span>':'') +
        (mine.filter(e=>e.ext).length?'<span class="tag n">📅'+mine.filter(e=>e.ext).length+'件</span>':'') +
        '</div>' +
        (mine.length ? '<div class="meta">' + mine.sort((a,b)=>toMin(a.start)-toMin(b.start))
          .map(e => '<span class="tag n">'+e.start+' '+esc(e.title.slice(0,14))+'</span>').join('') + '</div>' : '') +
        '</div><div class="acts">' +
        '<button class="btn sm" onclick="closeM();setMode(\'me\');setMe(\''+s0.id+'\')">この人を見る</button>' +
        '<button class="btn sm pri" onclick="closeM();openSch(null,null,\''+d+'\',\''+s0.id+'\')">＋予定</button>' +
        '</div></div>';
    }).join('');

  }else if(kind === 'todo' || kind === 'todoOpen' || kind === 'todoOver' || kind === 'todoToday'){
    let list = myTodos(liveTodos());
    if(kind === 'todo')      { list = list.filter(t => t.due && t.due <= d); title = '本日までのToDo'; }
    else if(kind === 'todoOver')  { list = list.filter(t => t.due && t.due < t0); title = '期限切れのToDo'; }
    else if(kind === 'todoToday') { list = list.filter(t => t.due === t0); title = '本日期限のToDo'; }
    else title = '未完了のToDo';
    list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
    title += '（' + list.length + '件）';
    body = list.length ? list.map(todoRow).join('') : '<div class="empty">該当するToDoはありません</div>';
    foot = '<button class="btn" onclick="closeM();go(\'todo\')">ToDo画面へ</button>';
  }

  shell(title, body, foot + '<div class="sp"></div><button class="btn pri" onclick="closeM()">閉じる</button>', true);
}

function nowLine(S0, cols){
  const n = new Date(); const m = n.getHours()*60 + n.getMinutes();
  const p = ((m - S0*60) / (cols*60)) * 100;
  if(p < 0 || p > 100) return '';
  return '<div class="now" style="left:'+p+'%" title="現在時刻"></div>';
}

    '<div class="v">'+v+'<small>'+u+'</small></div></div>';
}

function setStage(jobId, k){
  const j = jobById(jobId); if(!j || j.status === k) return;
  const from = j.status; j.status = k;
  j.stageAt = j.stageAt || {}; j.stageAt[k] = nowISO();
  logIt('案件', j.id, j.customer+' '+j.title, '工程', from, k);
  save(); render();
  toast('工程を「'+k+'」に変更しました', ()=>{ j.status = from; logIt('案件', j.id, j.customer, '工程（取消）', k, from); });
}

/* Googleカレンダーの予定を、内容そのままアプリの予定として取り込む */
function importExt(evId, staffId){
  const g = (DB.gcal||[]).find(x => x.evId === evId && x.staffId === staffId);
  if(!g) return;
  const dup = DB.sch.find(e => e.gid === evId);
  if(dup){ openSch(dup.id); toast('すでに取り込み済みの予定です'); return; }
  /* 件名から顧客名らしき部分を拾って案件を探す */
  const guess = liveJobs().find(j => j.customer && (g.title||'').indexOf(j.customer) >= 0);
  M = {
    id:'', jobId: guess ? guess.id : '',
    title: g.title || '（無題）',
    date: g.date,
    start: g.allDay ? '09:00' : g.start,
    end:   g.allDay ? '10:00' : g.end,
    allDay: !!g.allDay, endDate: g.endDate || g.date,
    who: [g.staffId],
    cat: guess ? guess.cat : 'その他',
    tent: false,
    address: g.location || (guess ? guess.address : ''),
    out: 0, back: 0,
    note: g.desc || '',
    guests: g.guests || '',
    gid: g.evId, gcalId: g.calId,
    _travelMsg: '', _from: 'gcal'
  };
  drawSch();
  if(M.address) setTimeout(()=>calcNow(true), 80);
  toast('Googleカレンダーの内容を読み込みました');
}

function jobRow(j){
  const bal = balOf(j), od = overdueDays(j), stuck = isStuck(j);
  const tds = DB.todos.filter(t => t.jobId === j.id && !t.del);
  const flags = [];
  if(isUnbilled(j)) flags.push('<span class="tag r">未請求 '+stageSince(j)+'日</span>');
  else if(isUnpaid(j)) flags.push('<span class="tag '+(od>60?'r':od>0?'o':'n')+'">未入金'+(od?' '+od+'日超過':'')+'</span>');
  if(stuck && !isUnbilled(j)) flags.push('<span class="tag o">滞留 '+stageSince(j)+'日</span>');
  const cash = (j.pays||[]).filter(p => p.method==='現金' && !p.depositId);
  if(cash.length) flags.push('<span class="tag r">現金未納金</span>');
  if(!flags.length && OPEN_STAGES.indexOf(j.status)>=0) flags.push('<span class="tag g">順調</span>');
  return '<tr class="rowlink" onclick="openJob(\''+j.id+'\')" title="タップして開く"><td><code style="font-size:11.5px;color:var(--tx-3)">'+esc(j.code)+'</code></td>' +
    '<td><b>'+esc(j.customer)+'</b><br><span style="font-size:11.5px;color:var(--tx-3)">'+esc(j.address)+'</span></td>' +
    '<td>'+esc(j.title)+(tds.length?'<br><span class="tag n">ToDo '+tds.filter(t=>!t.done).length+'/'+tds.length+'</span>':'')+'</td>' +
    '<td><span class="tag" style="background:'+STAGE_COLOR[j.status]+'22;color:'+STAGE_COLOR[j.status]+'">'+esc(j.status)+'</span></td>' +
    '<td>'+((j.owners||[]).length?avatars(j.owners):'<span class="tag n">未定</span>')+'</td>' +
    '<td style="text-align:right">'+(j.est?money(j.est):'—')+'</td>' +
    '<td style="text-align:right">'+(j.inv?money(j.inv):'—')+'</td>' +
    '<td style="text-align:right"><b style="color:'+(bal>0?'var(--danger)':'var(--tx-3)')+'">'+(j.inv?money(bal):'—')+'</b></td>' +

const SCOPES = {job:'案件', personal:'個人', shared:'共有'};
function viewTodo(){
  purgeOld();
  const tab = S.todoF.tab;
  let list = myTodos(tab==='done' ? doneTodos() : tab==='bin' ? binTodos() : liveTodos());
  if(S.todoF.cat !== 'all') list = list.filter(t => (t.cat||'') === (S.todoF.cat==='none'?'':S.todoF.cat));
  if(S.todoF.scope !== 'all') list = list.filter(t => t.scope === S.todoF.scope);
  if(!isMe() && S.todoF.who !== 'all') list = list.filter(t => (t.who||[]).includes(S.todoF.who));
  const rank = {'至急':0,'高':1,'中':2,'低':3};
  if(tab === 'open') list.sort((a,b) => (a.due||'9999').localeCompare(b.due||'9999') || (rank[a.prio]??9)-(rank[b.prio]??9));

  const t0 = today(), base = myTodos(liveTodos());
  const over = base.filter(t => t.due && t.due < t0).length;
  const dueT = base.filter(t => t.due === t0).length;
  const open = base.length;
  const nDone = myTodos(doneTodos()).length, nBin = myTodos(binTodos()).length;

  document.getElementById('body').innerHTML =
    '<div class="stats">' +
      stat('未完了', open, '件', open?'var(--info)':'var(--ok)', 'todoOpen') +
      stat('期限切れ', over, '件', over?'var(--danger)':'var(--ok)', 'todoOver') +
      stat('本日期限', dueT, '件', dueT?'var(--warn)':'var(--ok)', 'todoToday') +
      stat('完了フォルダ', nDone, '件', 'var(--ok)') +
    '</div>' +
    catBar() +
    '<section class="panel"><header><h2>' + (S.todoF.cat==='all' ? 'ToDoリスト' :
        (S.todoF.cat==='none' ? '未分類' : esc(tcatName(S.todoF.cat)))) + '</h2>' +
      (S.todoF.cat!=='all' && S.todoF.cat!=='none'
        ? '<button class="btn sm" onclick="openCat(\''+S.todoF.cat+'\')">カテゴリーを編集</button>' : '') +
      '<div class="sp"></div>' +
      '<div class="filters">' +
        '<select onchange="S.todoF.scope=this.value;viewTodo()">' +
          '<option value="all">すべての種類</option>' +
          Object.keys(SCOPES).map(k => '<option value="'+k+'"'+(S.todoF.scope===k?' selected':'')+'>'+SCOPES[k]+'</option>').join('') + '</select>' +
        (isMe() ? '' : '<select onchange="S.todoF.who=this.value;viewTodo()"><option value="all">すべての担当者</option>' +
          activeStaff().map(s => '<option value="'+s.id+'"'+(S.todoF.who===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('') + '</select>') +
      '</div></header>' +
      '<div class="pad"><div class="modesw" style="margin:0 0 12px">' +
        ['open|進行中|'+open, 'done|完了フォルダ|'+nDone, 'bin|ゴミ箱|'+nBin].map(x => {
          const [v,l,n] = x.split('|');
          return '<button class="'+(tab===v?'on':'')+'" onclick="S.todoF.tab=\''+v+'\';viewTodo()">'+l+' '+n+'</button>';
        }).join('') + '</div>' +
        (tab!=='open' ? '<div class="hintline" style="margin:-4px 0 10px">' +
          (tab==='done' ? '完了したToDoはここに保管され、' : '削除したToDoはここに残り、') +
          keepDays()+'日後に自動で消去されます。' +
          (list.length ? '　<button class="btn sm" onclick="'+(tab==='done'?'emptyDone()':'emptyBin()')+'">いますぐ全部消す</button>' : '') +
          '</div>' : '') +
        (list.length ? (tab==='open' && S.todoF.cat==='all' ? groupedTodos(list) : list.map(todoRow).join(''))
          : '<div class="empty">' + (tab==='done' ? '完了したToDoはありません' : tab==='bin' ? 'ゴミ箱は空です' : '該当するToDoはありません') + '</div>') +
      '</div>' +
    '</section>';
}
function emptyDone(){
  if(!confirm('完了フォルダのToDoをすべて完全に削除します。よろしいですか？')) return;
  const keep = DB.todos.filter(t => !(!t.del && t.done));
  const removed = DB.todos.filter(t => (!t.del && t.done));
  DB.todos = keep; save(); render();
  toast(removed.length+'件を削除しました', ()=>{ DB.todos = DB.todos.concat(removed); });
}
function emptyBin(){
  if(!confirm('ゴミ箱を空にします。この操作は元に戻せません。')) return;
  DB.todos = DB.todos.filter(t => !t.del); save(); render(); toast('ゴミ箱を空にしました');
}
function groupedTodos(list){
  const order = DB.cats.map(c => c.id).concat(['']);
  const out = [];
  order.forEach(id => {
    const g = list.filter(t => (t.cat||'') === id);
    if(!g.length) return;
    const col = id ? tcatColor(id) : '#9aa3ae';
    out.push('<div style="display:flex;align-items:center;gap:8px;margin:14px 0 8px">' +
      '<i style="width:10px;height:10px;border-radius:50%;background:'+col+'"></i>' +
      '<b style="font-size:13px">'+esc(id?tcatName(id):'未分類')+'</b>' +
      '<span class="tag n">'+g.length+'</span>' +
      (id ? '<button class="btn sm gh" style="color:var(--tx-3)" onclick="openCat(\''+id+'\')">編集</button>' : '') +
      '</div>' + g.map(todoRow).join(''));
  });
  return out.join('');
}

function todoRow(t){
  const j = t.jobId ? jobById(t.jobId) : null;

  const late = !t.done && t.due && t.due < t0;
  const soon = !t.done && t.due === t0;
  const doneN = (t.subs||[]).filter(x => x.d).length, allN = (t.subs||[]).length;
  return '<div class="todo rowlink2'+(t.done?' done':'')+'" onclick="openTodo(\''+t.id+'\')" title="タップして開く">' +
    '<button class="ck" onclick="event.stopPropagation();'+(t.del?'restoreTodo':'toggleTodo')+'(\''+t.id+'\')" title="'+(t.del?'復元する':'完了にする')+'">'+(t.done?'✓':'')+'</button>' +
    '<div class="bd">' +
      '<div class="ttl">'+esc(t.title)+'</div>' +
      '<div class="meta">' +
        tcatTag(t.cat) +
        '<span class="tag '+(t.scope==='job'?'b':t.scope==='shared'?'n':'g')+'">'+SCOPES[t.scope]+'</span>' +
        (j ? '<span class="tag n">'+esc(j.customer)+'</span>' : '') +
        '<span class="tag '+(PRIOS[t.prio]||'n')+'">'+esc(t.prio)+'</span>' +
        (t.due ? '<span class="tag '+(late?'r':soon?'o':'n')+'">'+(late?'期限切れ ':soon?'本日 ':'')+fmtD(t.due)+'</span>' : '') +
        avatars(t.who) +
        (t.memo ? '<span class="tag n" title="'+esc(t.memo)+'">メモ</span>' : '') +
      '</div>' +
      (t.del || t.done ? '<div class="meta">' +
        (t.done && t.doneAt ? '<span class="tag g">完了 '+esc(jDay(t.doneAt).slice(5).replace('-','/'))+'</span>' : '') +
        (t.del && t.delAt   ? '<span class="tag r">削除 '+esc(jDay(t.delAt).slice(5).replace('-','/'))+'</span>' : '') +
        '<span class="tag n">あと'+Math.max(0, keepDays() - daysAgo(t.del ? t.delAt : t.doneAt))+'日で自動消去</span>' +
        '</div>' : '') +
      (allN ? '<div class="subs">' + t.subs.map((x,i) =>
        '<button class="sub'+(x.d?' done':'')+'" onclick="event.stopPropagation();toggleSub(\''+t.id+'\','+i+')">' +
        '<span class="ck">'+(x.d?'✓':'')+'</span>'+esc(x.t)+'</button>').join('') +
        '</div><div class="bar"><i style="width:'+Math.round(doneN/allN*100)+'%"></i></div>' : '') +
    '</div>' +
    '<div class="acts" onclick="event.stopPropagation()">' +
      (t.del
        ? '<button class="btn sm" onclick="restoreTodo(\''+t.id+'\')">復元</button>' +
          (isAdmin() ? '<button class="btn sm dg" onclick="purgeTodo(\''+t.id+'\')">完全に削除</button>' : '')
        : (t.done
            ? '<button class="btn sm" onclick="toggleTodo(\''+t.id+'\')">戻す</button>' +
              (canDel('todos') ? '<button class="btn sm dg" onclick="trashTodo(\''+t.id+'\')">削除</button>' : '')
            : '<button class="btn sm" title="予定に変換" onclick="todoToSch(\''+t.id+'\')">→予定</button>')) +
    '</div></div>';
}
function toggleTodo(id){
  const t = DB.todos.find(x=>x.id===id); if(!t) return;
  const was = t.done;
  t.done = !t.done;
  t.doneAt = t.done ? nowISO() : '';
  save(); render();
  if(t.done) toast('完了フォルダに保管しました', ()=>{ t.done = was; t.doneAt = ''; });
}
function trashTodo(id){
  if(!canDel('todos')){ denyDel('todos'); return; }
  const t = DB.todos.find(x=>x.id===id); if(!t) return;
  t.del = true; t.delAt = nowISO(); logIt('ToDo', t.jobId||t.id, t.title, 'ToDoの削除', '', 'ゴミ箱へ');
  save(); render();
  toast('ゴミ箱に移しました（'+keepDays()+'日間は復元できます）', ()=>{ t.del = false; t.delAt = ''; });
}
function restoreTodo(id){
  const t = DB.todos.find(x=>x.id===id); if(!t) return;
  t.del = false; t.delAt = ''; save(); render(); toast('復元しました');
}
function purgeTodo(id){
  if(!isAdmin()){ denyDel('todos'); return; }
  if(!confirm('このToDoを完全に削除します。元に戻せません。')) return;
  const t = DB.todos.find(x=>x.id===id);
  if(t) logIt('ToDo', t.jobId||t.id, t.title, 'ToDoを完全に削除', '', '完全削除');
  DB.todos = DB.todos.filter(x => x.id !== id); save(); render();
  toast('完全に削除しました', ()=>{ DB.todos.push(t); });

function openDeposit(staffId){

  M = {staffId, date: today(), amount: rows ? rows.amount : 0, receivedBy: actor()||'', note:'', items: rows?rows.items:[]};
  drawDeposit();
}
function drawDeposit(){
  const s0 = staffById(M.staffId);

    '<div class="grid2">' +
      f('納金日','<input type="date" value="'+M.date+'" onchange="M.date=this.value">') +
      f('受け取った人','<select onchange="M.receivedBy=this.value"><option value="">選択してください</option>' +
        activeStaff().map(s=>'<option value="'+s.id+'"'+(M.receivedBy===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('') + '</select>') +
    '</div>' +
    f('備考','<input value="'+esc(M.note)+'" oninput="M.note=this.value">') +
    '<div class="hintline">受け取った人は、集金した本人以外を選ぶ運用にしてください（相互チェックになります）。</div>',
    '<div class="sp"></div><button class="btn" onclick="askClose()">キャンセル</button>' +
    '<button class="btn pri" onclick="saveDeposit()">納金を登録</button>');

function saveDeposit(){
  if(!M.items.length){ alert('対象の集金がありません'); return; }
  if(!M.receivedBy){ alert('受け取った人を選んでください'); return; }
  const s0 = staffById(M.staffId);
  const dep = {id:uid('dep'), date:M.date, staffId:M.staffId, amount:M.amount,
    receivedBy:M.receivedBy, note:M.note, by:actor(), byName:actorName(), at:nowISO(),
    payIds: M.items.map(x => x.p.id)};
  DB.deposits.push(dep);
  M.items.forEach(x => { x.p.depositId = dep.id; });
  logIt('納金', dep.id, (s0||{}).name+' の現金納金', '納金', '', money(M.amount) + '（受領：'+((staffById(M.receivedBy)||{}).name||'')+'）');
  save(); closeM(); render(); toast('納金を登録しました');
}
/* ---------- 月次の締め ---------- */
function closeMonth(){
  const mm = S.month, all = liveJobs();
  const unbilled = all.filter(isUnbilled), unpaid = all.filter(isUnpaid);
  const sum = a => a.reduce((x,y)=>x+y,0);
  const rec = {month:mm, at:nowISO(), by:actor(), byName:actorName(),
    unbilled:unbilled.length, unbilledYen:sum(unbilled.map(j=>j.order||j.est||0)),
    unpaid:unpaid.length, unpaidYen:sum(unpaid.map(balOf)),
    over60:unpaid.filter(j=>overdueDays(j)>60).length,
    cashYen:sum(cashHeldRows().map(r=>r.amount))};
  if(!confirm(mm+' を締めます。この時点の未請求・未入金・現金残高を記録します。よろしいですか？')) return;
  DB.closes = (DB.closes||[]).filter(c => c.month !== mm).concat([rec]);
  logIt('締め', rec.month, mm+' 売掛会議', '月次締め', '', '未請求'+rec.unbilled+'件／未入金'+rec.unpaid+'件');
  save(); render(); toast(mm+' を締めました');
}

function calMapHtml(){
  return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px">' +
    activeStaff().map(s0 => {
      const cur = (DB.cfg.cal||{})[s0.id] || '';
      const sel = CALS
        ? '<select onchange="setCal(\''+s0.id+'\',this.value)" style="flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px">' +
            '<option value="">（連携しない）</option>' +
            CALS.map(c => '<option value="'+esc(c.id)+'"'+(cur===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('') +
            (cur && !CALS.some(c=>c.id===cur) ? '<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>' : '') +
          '</select>'
        : '<input value="'+esc(cur)+'" placeholder="カレンダーID（例：xxx@gmail.com）" onchange="setCal(\''+s0.id+'\',this.value.trim())" ' +
          'style="flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px">';
      return '<div style="display:flex;align-items:center;gap:8px">' + avatar(s0) +
        '<span style="width:44px;font-size:12.5px">'+esc(s0.name)+'</span>' + sel + '</div>';
    }).join('') + '</div>';
}
function setCal(staffId, calId){
  DB.cfg.cal = DB.cfg.cal || {};
  if(calId) DB.cfg.cal[staffId] = calId; else delete DB.cfg.cal[staffId];
  save();
  const el = document.getElementById('calmap'); if(el) el.innerHTML = calMapHtml();
}
function togMailTo(id){
  const a = DB.cfg.mailTo = DB.cfg.mailTo || [];
  const i = a.indexOf(id); if(i<0) a.push(id); else a.splice(i,1);
  save(); render();
}
function markSeenQuiet(){ DB.cfg.seenAt = nowISO(); save(); render(); }
function testMail(){
  if(!Sync.ready()){ alert('先に同期の設定を行ってください'); return; }
  const to = mailTargets(false);
  if(!to.length){ alert('メールアドレスが登録されていません。担当者欄で登録してください。'); return; }
  toast('送信中…');
  Sync.call('notify', {to, subject:'【テスト】金剛住機 スケジュール',
    body:'これはテストメールです。\n\n送信者：'+actorName()+'\n宛先：'+to.join(', ')})
    .then(r => alert(r.ok ? (r.sent||0)+'件送信しました。受信箱をご確認ください。'+
      (r.remaining!==undefined?'\n本日の残り送信可能数：'+r.remaining:'') : '失敗：'+(r.error||'')))
    .catch(e => alert('送信に失敗しました：'+e.message+'\n\nコード.gs を貼り直して再デプロイし、メール送信の許可を与えたかご確認ください。'));
}
function loadCals(){
  if(!Sync.ready()){ alert('先に同期の設定（Apps ScriptのURLと合言葉）を行ってください'); return; }
  toast('カレンダー一覧を取得中…');
  Sync.listCalendars().then(list => {
    CALS = list;
    const el = document.getElementById('calmap'); if(el) el.innerHTML = calMapHtml();
    toast(list.length + '件のカレンダーが見つかりました');
  }).catch(e => alert('取得に失敗しました：' + e.message +
    '\n\nApps Script を貼り直して「新バージョン」で再デプロイし、カレンダーへのアクセス許可を与えたかご確認ください。'));
}
function pullCal(){
  if(!Sync.ready()){ alert('先に同期の設定を行ってください'); return; }
  toast('カレンダーを取り込み中…');
  Sync.calPull().then(() => { render(); toast((DB.gcal||[]).length + '件の予定を取り込みました'); })
    .catch(e => alert('取り込みに失敗しました：' + e.message));
}
