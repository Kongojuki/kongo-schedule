function delStaff(id){
  if(!isAdmin()){ alert('担当者を消せるのは管理者（' + adminNames() + '）だけです。'); return; }
  if(!confirm('この担当者を削除します。予定・ToDoからも外れます。')) return;
  DB.staff = DB.staff.filter(s => s.id !== id);
  DB.sch.forEach(e => e.who = e.who.filter(w => w !== id));
  DB.todos.forEach(t => t.who = (t.who||[]).filter(w => w !== id));
  if(S.me === id){ S.me = (activeStaff()[0]||{}).id||''; DB.cfg.me = S.me; }
  save(); render();
}
function exportJSON(){
  const b = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'kongo-schedule-' + today() + '.json'; a.click();
}
function importJSON(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ DB = JSON.parse(r.result); save(); DB = load(); render(); toast('読み込みました'); }
    catch(e){ alert('ファイルを読み込めませんでした'); } };
  r.readAsText(f);
}

let M_DOWN = false;// 背景の上でマウス／指を押し始めたか
/* 「_」で始まる作業用の項目は比較から除く */
const snapOf = o => o ? JSON.stringify(o, (k,v) => k.charAt(0) === '_' ? undefined : v) : '';
const isDirty = () => M_SNAP !== null && snapOf(M) !== M_SNAP;
function closeM(){ M = null; M_SNAP = null; M_DOWN = false; document.getElementById('modal').innerHTML = ''; }
/* ×・キャンセル・背景クリックからの閉じる（未保存なら確認） */
function askClose(){
  if(isDirty() && !confirm('入力した内容がまだ保存されていません。\n保存せずに閉じてもよろしいですか？')) return;
  closeM();
}
/* 背景クリックで閉じる。ただし枠の中から始まったドラッグでは閉じない */
function ovDown(e, el){ M_DOWN = (e.target === el); }
function ovClick(e, el){ if(e.target === el && M_DOWN) askClose(); M_DOWN = false; }
function shell(title, inner, foot, wide){
  const box = document.getElementById('modal');
  if(!box.innerHTML) M_SNAP = snapOf(M);   // 開いた瞬間だけ記録（描き直しでは保持）
  box.innerHTML =
    '<div class="ov" onmousedown="ovDown(event,this)" ontouchstart="ovDown(event,this)" onclick="ovClick(event,this)">' +
    '<div class="modal'+(wide?' wide':'')+'">' +
      '<header><h3>'+esc(title)+'</h3><button class="x" onclick="askClose()">×</button></header>' +
      '<div class="content">'+inner+'</div><footer>'+foot+'</footer></div></div>';
}
/* 担当者の複数選択（予定・ToDo・日報で共用） */
function whoPicker(sel, cb){
  return '<div class="pick">' + activeStaff().map(s =>
    '<button type="button" class="'+(sel.includes(s.id)?'on':'')+'" onclick="'+cb+'(\''+s.id+'\')">' +
    avatar(s) + esc(s.name) + '</button>').join('') +
    '<button type="button" class="'+(sel.length===activeStaff().length?'on':'')+'" ' +
    'onclick="'+cb+'(\'__all\')" style="padding:5px 13px">全員</button></div>';
}
function togWho(list, id){
  if(id === '__all'){
    const all = activeStaff().map(s=>s.id);
    return list.length === all.length ? [] : all;
  }
  return list.includes(id) ? list.filter(x=>x!==id) : list.concat([id]);
}

function f(label, inner){ return '<div class="f"><label>'+label+'</label>'+inner+'</div>'; }
function saveJob(){
  if(!M.customer.trim()){ alert('顧客・現場名を入力してください'); return; }
  if(!M.title.trim()) M.title = M.cat;
  const label = M.customer + ' ' + M.title;
  const tabTmp = M._tab, from = M._stageFrom; delete M._tab; delete M._stageFrom;
  if(M.id){
    const old = jobById(M.id);
    [['status','工程'],['inv','請求金額'],['est','見積金額'],['order','受注金額'],
     ['invNo','請求書番号'],['invDate','請求日'],['due','入金期日']].forEach(x => {
      if(String(old[x[0]]||'') !== String(M[x[0]]||'')) logIt('案件', M.id, label, x[1], old[x[0]], M[x[0]]);
    });
    if(whoNames(old.owners||[]) !== whoNames(M.owners||[]))
      logIt('案件', M.id, label, '責任者', whoNames(old.owners||[]), whoNames(M.owners||[]));
    Object.assign(old, M);
  }else{
    M.id = uid('j'); M.stageAt = M.stageAt||{}; if(!M.stageAt[M.status]) M.stageAt[M.status] = nowISO();
    DB.jobs.push(M); logIt('案件', M.id, label, '新規受付', '', M.status);
    sendMail('【新規受付】' + M.customer + '　' + M.title,
      ['新しい受付が登録されました。', '',
       '顧客・現場：' + M.customer, '件名：' + M.title, '区分：' + M.cat, '優先度：' + M.prio,
       '住所：' + (M.address||'—'), '電話：' + (M.phone||'—'),
       '内容：' + (M.detail||'—'),
       '責任者：' + ((M.owners||[]).length ? whoNames(M.owners) : '未定'),
       '', '登録者：' + actorName(), '受付№：' + M.code].join('\n'));
  }
  save(); closeM(); render(); toast('保存しました');
}
/* ---------- 入金の登録（案件モーダル内） ---------- */
let JOB_BACK = null, P = null;
function openPay(){
  JOB_BACK = M;
  const bal = balOf(M);
  P = {date: today(), amount: bal > 0 ? bal : 0, method:'振込', receiptNo:'', collector: actor()||'', note:''};
  drawPay();
}
function drawPay(){
  const cash = P.method === '現金';
  shell('入金の登録　—　' + esc(JOB_BACK.customer),
    '<div class="grid2">' +
      f('入金日','<input type="date" value="'+P.date+'" onchange="P.date=this.value">') +
      f('金額','<input type="number" min="0" value="'+P.amount+'" onchange="P.amount=+this.value||0">') +
    '</div>' +
    f('入金方法','<div class="pick plain">' + PAY_METHODS.map(m =>
      '<button type="button" class="'+(P.method===m?'on':'')+'" onclick="P.method=\''+m+'\';drawPay()">'+m+'</button>').join('') + '</div>') +
    (cash ? '<div class="sec" style="border-color:var(--danger)"><h4 style="color:var(--danger)">現金の場合は必ず記入してください</h4>' +
      '<div class="grid2">' +
        f('領収書番号（連番）','<input value="'+esc(P.receiptNo)+'" oninput="P.receiptNo=this.value" placeholder="例）No.001234">') +
        f('集金した人','<select onchange="P.collector=this.value"><option value="">選択してください</option>' +
          activeStaff().map(s=>'<option value="'+s.id+'"'+(P.collector===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('') + '</select>') +
      '</div>' +
      '<div class="hintline">登録すると、その人の「現金預り残高」に加算されます。会社へ納めたら売掛会議の画面で納金を登録してください。</div></div>'
      : '') +
    f('備考','<input value="'+esc(P.note)+'" oninput="P.note=this.value">') +
    '<div class="hintline">操作者：<b>'+esc(actorName())+'</b>（記録に残ります）</div>',
    '<div class="sp"></div><button class="btn" onclick="M=JOB_BACK;JOB_BACK=null;drawJob()">キャンセル</button>' +
    '<button class="btn pri" onclick="savePay()">登録する</button>');
}
function savePay(){
  if(!(P.amount > 0)){ alert('金額を入力してください'); return; }
  if(P.method === '現金'){
    if(!P.receiptNo.trim()){ alert('現金の場合は領収書番号が必要です'); return; }
    if(!P.collector){ alert('集金した人を選んでください'); return; }
  }
  M = JOB_BACK; JOB_BACK = null;
  M.pays = M.pays || [];
  M.pays.push(Object.assign({id:uid('pay'), depositId:'', by:actor(), byName:actorName(), at:nowISO()}, P));
  logIt('入金', M.id, M.customer+' '+M.title, '入金登録（'+P.method+'）', '', money(P.amount) + (P.receiptNo?' / 領収書'+P.receiptNo:''));
  P = null; drawJob();
}
function delPay(i){
  if(!canDel('pays')){ denyDel('pays'); return; }
  const p = M.pays[i];
  if(p.depositId){ alert('納金済みの入金は削除できません。売掛会議画面で納金を取り消してください。'); return; }
  if(!confirm('この入金記録を削除します。履歴には残ります。')) return;
  M.pays.splice(i,1);
  logIt('入金', M.id, M.customer, '入金取消（'+p.method+'）', money(p.amount), '削除');
  drawJob();
}

function delJob(){
  if(!canDel('jobs')) return reqDelJob();
  const j = DB.jobs.find(x => x.id === M.id); if(!j) return;
  const bal = balOf(j);
  const warn = (bal > 0 ? '\n\n⚠ この案件には未入金 ' + money(bal) + ' が残っています。' : '');
  const why = prompt('この案件を「削除済み」に移します。\n記録は消えません。あとから元に戻せます。' + warn +
    '\n\n削除する理由を入力してください（必須・履歴に残ります）', '');
  if(why === null) return;
  if(!String(why).trim()){ alert('理由を入力してください'); return; }
  j.del = true; j.delAt = nowISO(); j.delBy = actor(); j.delByName = actorName(); j.delWhy = String(why).trim(); j.delReq = null;
  logIt('案件', j.id, j.customer+' '+j.title, '案件を削除済みへ', j.status, String(why).trim());
  save(); closeM(); render();
  toast('削除済みに移しました（受付・案件の下にあります）');
}
/* 管理者以外は「依頼」だけできる（勝手に消せない） */
function reqDelJob(){
  const j = DB.jobs.find(x => x.id === M.id); if(!j) return;
  const why = prompt('削除できるのは管理者（' + adminNames() + '）だけです。\n' +
    '管理者あてに「削除の依頼」を送ります。\n\n理由を入力してください（必須）', '');
  if(why === null) return;
  if(!String(why).trim()){ alert('理由を入力してください'); return; }
  j.delReq = {by: actor(), byName: actorName(), at: nowISO(), why: String(why).trim()};
  logIt('案件', j.id, j.customer+' '+j.title, '削除の依頼', j.status, String(why).trim());
  save(); closeM(); render(); toast('管理者に削除を依頼しました');
}
function restoreJob(id){
  const j = DB.jobs.find(x => x.id === id); if(!j) return;
  j.del = false; j.delAt = ''; j.delWhy = ''; j.delBy = ''; j.delByName = '';
  logIt('案件', j.id, j.customer+' '+j.title, '案件を元に戻す', '削除済み', j.status);
  save(); render(); toast('元に戻しました');
}
function dropReq(id){
  const j = DB.jobs.find(x => x.id === id); if(!j || !j.delReq) return;
  logIt('案件', j.id, j.customer+' '+j.title, '削除の依頼を却下', j.delReq.why||'', '却下');
  j.delReq = null; save(); render(); toast('依頼を取り下げました');
}

function openSch(id, jobId, date, staffId, pre){

  else{
    const j = jobId ? jobById(jobId) : null;
    M = {id:'', jobId: jobId||'', title: (pre&&pre.title) || (j ? j.customer+' '+j.title : ''),
      date: date || S.date, start:'09:00', end:'10:00', allDay:false, endDate:'', guests:'', gid:'', gcalId:'',
      who: (pre&&pre.who) || (staffId ? [staffId] : (isMe() ? [S.me] : [])),
      cat: j ? j.cat : '修理', tent:false,
      address: (pre&&pre.address) || (j ? j.address : ''),
      out:0, back:0, note:(pre&&pre.note)||'', fromTodo:(pre&&pre.fromTodo)||''};
    if(M.address) setTimeout(()=>calcNow(true), 60);
  }
  M._travelMsg = '';
  drawSch();
}
function drawSch(){
  const tot = (toMin(M.end)-toMin(M.start));
  const occ = tot + (M.out|0) + (M.back|0);
  shell(M.id ? '予定の編集' : (M.gid ? 'Googleカレンダーから取り込む' : '予定を追加'),
    (M.gid ? '<div class="hintline" style="background:var(--line-2);padding:8px 11px;border-radius:9px">' +
      '📅 Googleカレンダーの予定から作成しています。件名・日時・場所・メモは引き継ぎ済みです。</div>' : '') +
    f('件名','<input value="'+esc(M.title)+'" oninput="M.title=this.value" placeholder="例）○○様邸 給湯器修理">') +

const durMin = () => Math.max(0, toMin(M.end) - toMin(M.start));
function durLabel(m){
  if(m % 60 === 0) return (m/60) + '時間';
  if(m < 60) return m + '分';
  return Math.floor(m/60) + '時間' + (m%60) + '分';
}
/* 開始を変えると、所要時間はそのままで終了もずれる（新規は1時間が既定） */
function setStart(v, fromInput){
  if(!v) return;
  const d = durMin() || 60;
  M.start = v;
  M.end = toHM(clamp(toMin(v) + d, 0, 1439));
  if(toMin(M.end) <= toMin(M.start)) M.end = toHM(clamp(toMin(v) + 60, 0, 1439));
  drawTime(fromInput ? 'start' : null);
}
function setEnd(v, fromInput){
  if(!v) return;
  M.end = v;
  if(toMin(M.end) <= toMin(M.start)) M.end = toHM(clamp(toMin(M.start) + 60, 0, 1439));
  drawTime(fromInput ? 'end' : null);
}
function setDur(m){ M.end = toHM(clamp(toMin(M.start) + m, 0, 1439)); drawTime(); }

/* 拘束時間の1行 */
function occHtml(){
  const occ = durMin() + (M.out|0) + (M.back|0);
  return '<b>拘束時間 '+Math.floor(occ/60)+'時間'+(occ%60)+'分</b>　' +
    toHM(toMin(M.start)-(M.out|0))+' 出発 → '+M.start+' 作業開始 → ' +
    M.end+' 作業終了 → '+toHM(toMin(M.end)+(M.back|0))+' 帰社';
}
/* 日付・時刻を変えたときは画面を作り直さず、必要な表示だけ書き換える。
   （スマホで、時を選んだ瞬間にカレンダーや時刻の画面が閉じてしまうのを防ぐため） */
function drawTime(skip){
  if(!M) return;
  const g = i => document.getElementById(i);
  const set = (i, v) => { const e = g(i); if(e && e.value !== v && document.activeElement !== e) e.value = v; };
  if(skip !== 'start')   set('t_start', M.start);
  if(skip !== 'end')     set('t_end',   M.end);
  if(skip !== 'date')    set('t_date',  M.date);
  if(skip !== 'endDate') set('t_end_date', M.endDate || M.date);
  set('t_out',  String(M.out|0));
  set('t_back', String(M.back|0));
  const dl = g('durlab'); if(dl) dl.textContent = durLabel(durMin());
  const db = g('durbtns');
  if(db) Array.prototype.forEach.call(db.querySelectorAll('button[data-m]'),
    b => b.classList.toggle('on', durMin() === +b.getAttribute('data-m')));
  const oc = g('occline'); if(oc) oc.innerHTML = occHtml();
  const tm = g('tmsg'); if(tm && M._travelMsg) tm.innerHTML = M._travelMsg;
}
function bumpEnd(m){ setEnd(toHM(clamp(toMin(M.end) + m, 0, 1439))); }

function drawSchLink(){ const e = document.getElementById('schmap'); if(e) e.innerHTML = mapBtn(M.address); }
function schWho(id){ M.who = togWho(M.who, id); drawSch(); }
function syncJob(){
  const j = M.jobId ? jobById(M.jobId) : null;
  if(j){ M.address = j.address; M.cat = j.cat; if(!M.title.trim()) M.title = j.customer+' '+j.title; }
  drawSch(); if(j && j.address) calcNow(true);
}
function calcNow(silent){
  if(!M) return;
  const el = document.getElementById('ad'); if(el) M.address = el.value;
  const msg = document.getElementById('tmsg');
  if(!(M.address||'').trim()){ if(!silent) alert('住所を入力してください'); return; }
  const tok = M._tok = uid('k');
  if(msg) msg.innerHTML = '計算中…';
  calcTravel(M.address).then(r => {
    if(!M || M._tok !== tok) return;
    M.out = r.min; M.back = r.min;
    M._travelMsg = '片道 <b>'+r.min+'分</b>' + (r.km ? '（'+r.km+'km）' : '') + ' ／ 取得元：' + r.src +
      (r.warn ? '<br><span style="color:var(--danger)">Google取得失敗：'+esc(r.warn)+'</span>' : '');
    drawTime();
  }).catch(e => {
    if(!M || M._tok !== tok) return;
    M._travelMsg = '<span style="color:var(--danger)">計算できませんでした：'+esc(e.message)+'</span>' +
      '<br>手入力するか、設定でAPIキー／目安表をご確認ください。';
    if(!M.out && !M.back){ M.out = DB.cfg.defBuffer; M.back = DB.cfg.defBuffer; }
    drawTime();
  });
}
function saveSch(){
  if(!M.title.trim()){ alert('件名を入力してください'); return; }
  if(!M.who.length && !confirm('担当者が未割当です。このまま保存しますか？')) return;
  if(M.allDay){ if(!M.endDate || M.endDate < M.date) M.endDate = M.date; }
  else if(toMin(M.end) <= toMin(M.start)){ alert('終了時刻は開始より後にしてください'); return; }
  const ft = M.fromTodo, isNew = !M.id; delete M._travelMsg; delete M.fromTodo; delete M._tok; delete M._from;
  if(M.id){ Object.assign(DB.sch.find(e=>e.id===M.id), M); }
  else { M.id = uid('e'); DB.sch.push(M); }
  if(ft){ const t = DB.todos.find(x=>x.id===ft); if(t) t.schId = M.id; }
  if(isNew && M.who.length){
    sendMail('【予定】' + fmtD(M.date) + ' ' + M.start + '　' + M.title,
      ['予定が割り当てられました。', '',
       '日時：' + fmtD(M.date) + ' ' + M.start + '–' + M.end,
       '件名：' + M.title, '区分：' + M.cat,
       '担当：' + whoNames(M.who),
       '住所：' + (M.address||'—'),
       ((M.out|0)||(M.back|0) ? '移動：往路' + (M.out|0) + '分／復路' + (M.back|0) + '分（' + toHM(toMin(M.start)-(M.out|0)) + ' 出発）' : ''),
       'メモ：' + (M.note||'—'), '', '登録者：' + actorName()].filter(Boolean).join('\n'), M.who);
  }
  save(); closeM(); render(); toast('予定を保存しました');
}
function delSch(){
  if(!canDel('sch')){ denyDel('sch'); return; }
  if(!confirm('この予定を削除しますか？（履歴には残ります）')) return;
  const e = DB.sch.find(x => x.id === M.id);
  if(e){ const j = e.jobId ? jobById(e.jobId) : null;
    logIt('予定', e.jobId || e.id, (j ? j.customer + ' ' : '') + e.title, '予定の削除',
      fmtD(e.date) + ' ' + (e.allDay ? '終日' : e.start), '削除'); }
  DB.sch = DB.sch.filter(x => x.id !== M.id); save(); closeM(); render();
}

      (M.subs.length ? M.subs.map((s,i) =>
        '<div style="display:flex;gap:6px;align-items:center">' +

        '<button class="btn sm dg" onclick="M.subs.splice('+i+',1);drawTodo()">×</button></div>').join('') : '<div class="hintline">項目がありません</div>') +
      '<button class="btn sm" onclick="M.subs.push({t:\'\',d:false});drawTodo()">＋ 項目を追加</button></div>',
    (M.id && canDel('todos') ? '<button class="btn dg" onclick="delTodo()">削除</button>' : '') +

}
function todoWho(id){ M.who = togWho(M.who, id); drawTodo(); }
function applyTpl(id){
  const p = DB.tpl.find(x=>x.id===id); if(!p) return;
  p.items.forEach(i => M.subs.push({t:i, d:false}));
  if(!M.title.trim()) M.title = p.name;
  drawTodo();
}
function saveTodo(){
  if(!M.title.trim()){ alert('やることを入力してください'); return; }
  M.subs = M.subs.filter(s => s.t.trim());
  if(M.id) Object.assign(DB.todos.find(t=>t.id===M.id), M);
  else { M.id = uid('t'); DB.todos.push(M); }
  save(); closeM(); render(); toast('ToDoを保存しました');
}
function delTodo(){
  if(!canDel('todos')){ denyDel('todos'); return; }
  const t = DB.todos.find(x => x.id === M.id); if(!t) return;
  t.del = true; t.delAt = nowISO(); logIt('ToDo', t.jobId||t.id, t.title, 'ToDoの削除', '', 'ゴミ箱へ');
  save(); closeM(); render();
  toast('ゴミ箱に移しました（'+keepDays()+'日間は復元できます）', ()=>{ t.del = false; t.delAt = ''; });
}

        '<option value="each"'+(M.mode==='each'?' selected':'')+'>項目ごとに1件ずつ</option>' +

    '<div class="hintline">'+ (DB.tpl.find(p=>p.id===M.tplId)||{items:[]}).items.map(i=>'・'+esc(i)).join('<br>') +'</div>',
    '<div class="sp"></div><button class="btn" onclick="askClose()">キャンセル</button>' +

function tplWho(id){ M.who = togWho(M.who, id); drawTplPick(); }
function runTpl(){
  const p = DB.tpl.find(x=>x.id===M.tplId); if(!p) return;
  const base = {scope: M.jobId?'job':'shared', jobId:M.jobId, who:M.who.slice(), due:M.due,
                prio:'中', done:false, cat: M.cat||p.cat||'', memo:'', created:today()};
  if(M.mode === 'one'){
    DB.todos.push(Object.assign({id:uid('t'), title:p.name, subs:p.items.map(i=>({t:i,d:false}))}, base));
  }else{
    p.items.forEach(i => DB.todos.push(Object.assign({id:uid('t'), title:i, subs:[]}, base)));
  }
  save(); closeM(); go('todo'); toast('ToDoを追加しました');
}
/* ---------- カテゴリーの追加・編集 ---------- */
const CAT_PALETTE = ['#2f6fd0','#e8792b','#22a06b','#8b5cf6','#17a2a2','#d63384','#d4a017','#d94a4a','#6b7280','#0ea5e9'];
let CAT_BACK = null;   // ToDo編集中に呼ばれた場合の復帰先
function openCat(id, fromTodo){
  if(fromTodo){ CAT_BACK = M; } else { CAT_BACK = null; }
  M = id ? Object.assign({}, DB.cats.find(c=>c.id===id))
         : {id:'', name:'', color: CAT_PALETTE[DB.cats.length % CAT_PALETTE.length]};
  drawCat();
}
function drawCat(){
  const n = M.id ? DB.todos.filter(t => t.cat === M.id).length : 0;
  shell(M.id ? 'カテゴリーの編集' : 'カテゴリーを追加',
    f('カテゴリー名','<input value="'+esc(M.name)+'" oninput="M.name=this.value" placeholder="例）見積・請求">') +
    f('色','<div class="pick" style="gap:8px">' + CAT_PALETTE.map(c =>
      '<button type="button" onclick="M.color=\''+c+'\';drawCat()" title="'+c+'" ' +
      'style="width:34px;height:34px;border-radius:50%;padding:0;background:'+c+';' +
      'border:3px solid '+(M.color===c?'var(--tx)':'transparent')+'"></button>').join('') +
      '<input type="color" value="'+M.color+'" onchange="M.color=this.value;drawCat()" ' +
      'style="width:44px;height:34px;border:none;background:none;padding:0">' + '</div>') +
    '<div class="hintline">プレビュー：' + '<span class="tag" style="background:'+M.color+'22;color:'+M.color+'">' +
      esc(M.name||'カテゴリー名') + '</span></div>' +
    (M.id && n ? '<div class="hintline">このカテゴリーのToDo：'+n+'件（削除すると未分類に移ります）</div>' : ''),
    (M.id ? '<button class="btn dg" onclick="delCat()">削除</button>' : '') +
    '<div class="sp"></div><button class="btn" onclick="backFromCat()">キャンセル</button>' +
    '<button class="btn pri" onclick="saveCat()">保存</button>');
}
function backFromCat(){
  if(CAT_BACK){ M = CAT_BACK; CAT_BACK = null; drawTodo(); }
  else closeM();
}
function saveCat(){
  if(!M.name.trim()){ alert('カテゴリー名を入力してください'); return; }
  let id = M.id;
  if(id) Object.assign(DB.cats.find(c=>c.id===id), M);
  else { id = M.id = uid('c'); DB.cats.push(Object.assign({}, M)); }
  save();
  if(CAT_BACK){ CAT_BACK.cat = id; M = CAT_BACK; CAT_BACK = null; drawTodo(); }
  else { closeM(); render(); }
  toast('カテゴリーを保存しました');
}
function delCat(){
  if(!isAdmin()){ alert('カテゴリーを消せるのは管理者（' + adminNames() + '）だけです。'); return; }
  const n = DB.todos.filter(t => t.cat === M.id).length;
  if(!confirm('このカテゴリーを削除します。'+(n?'ToDo '+n+'件は「未分類」に移ります。':''))) return;
  DB.todos.forEach(t => { if(t.cat === M.id) t.cat = ''; });
  DB.tpl.forEach(p => { if(p.cat === M.id) p.cat = ''; });
  DB.cats = DB.cats.filter(c => c.id !== M.id);
  if(S.todoF.cat === M.id) S.todoF.cat = 'all';
  save(); CAT_BACK = null; closeM(); render();
}
function moveCat(id, dir){
  const i = DB.cats.findIndex(c => c.id === id), j = i + dir;
  if(i < 0 || j < 0 || j >= DB.cats.length) return;
  const t = DB.cats[i]; DB.cats[i] = DB.cats[j]; DB.cats[j] = t;
  save(); render();
}

/* テンプレート編集 */
function openTpl(id){
  M = id ? Object.assign({}, DB.tpl.find(p=>p.id===id)) : {id:'', name:'', cat:'', items:['']};
  M.items = M.items.slice(); drawTpl();
}
function drawTpl(){
  shell(M.id?'テンプレートの編集':'テンプレートを追加',
    f('名前','<input value="'+esc(M.name)+'" oninput="M.name=this.value" placeholder="例）給湯器交換">') +
    f('既定のカテゴリー','<select onchange="M.cat=this.value"><option value="">未分類</option>' +
      DB.cats.map(c=>'<option value="'+c.id+'"'+(M.cat===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>') +
    '<div class="sec"><h4>作業項目</h4>' +
      M.items.map((t,i)=>'<div style="display:flex;gap:6px"><input value="'+esc(t)+'" oninput="M.items['+i+']=this.value" ' +
        'style="flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:8px">' +
        '<button class="btn sm dg" onclick="M.items.splice('+i+',1);drawTpl()">×</button></div>').join('') +
      '<button class="btn sm" onclick="M.items.push(\'\');drawTpl()">＋ 項目を追加</button></div>',
    (M.id?'<button class="btn dg" onclick="DB.tpl=DB.tpl.filter(p=>p.id!==M.id);save();closeM();render()">削除</button>':'') +
    '<div class="sp"></div><button class="btn" onclick="askClose()">キャンセル</button>' +
    '<button class="btn pri" onclick="saveTpl()">保存</button>');
}
function saveTpl(){
  M.items = M.items.filter(t=>t.trim());
  if(!M.name.trim()||!M.items.length){ alert('名前と項目を入力してください'); return; }
  if(M.id) Object.assign(DB.tpl.find(p=>p.id===M.id), M);
  else { M.id = uid('p'); DB.tpl.push(M); }
  save(); closeM(); render();
}

/* ============================================================
   日報／勤怠モーダル
   ============================================================ */
function openReport(id){
  M = id ? Object.assign({}, DB.reports.find(r=>r.id===id)) : {id:'', date:S.date, who: isMe()?[S.me]:[], hours:8, body:''};
  M.who = (M.who||[]).slice(); drawReport();
}
function drawReport(){
  shell('日報',
    '<div class="grid2">' + f('日付','<input type="date" value="'+M.date+'" onchange="M.date=this.value">') +
      f('実働（時間）','<input type="number" step="0.5" min="0" value="'+M.hours+'" onchange="M.hours=+this.value||0">') + '</div>' +
    '<div class="sec"><h4>担当者（複数選択できます）</h4>' + whoPicker(M.who,'repWho') + '</div>' +
    f('作業内容','<textarea style="min-height:150px" oninput="M.body=this.value">'+esc(M.body)+'</textarea>'),
    (M.id?'<button class="btn dg" onclick="DB.reports=DB.reports.filter(r=>r.id!==M.id);save();closeM();render()">削除</button>':'') +
    '<div class="sp"></div><button class="btn" onclick="askClose()">キャンセル</button>' +
    '<button class="btn pri" onclick="saveReport()">保存</button>');
}
function repWho(id){ M.who = togWho(M.who, id); drawReport(); }
function saveReport(){
  if(!M.who.length){ alert('担当者を選んでください'); return; }
  if(M.id) Object.assign(DB.reports.find(r=>r.id===M.id), M);
  else { M.id = uid('r'); DB.reports.push(M); }
  save(); closeM(); render(); toast('日報を保存しました');
}
function openAtd(staffId){
  staffId = staffId || (isMe() ? S.me : null);
  const ex = DB.atd.find(a => a.date===S.date && a.who===staffId);
  M = ex ? Object.assign({}, ex) : {id:'', date:S.date, who:staffId||(isMe()?S.me:(activeStaff()[0]||{}).id), type:'出勤', note:''};
  drawAtd();
}
function drawAtd(){
  shell('勤怠の登録',
    '<div class="grid2">' + f('日付','<input type="date" value="'+M.date+'" onchange="M.date=this.value">') +
      f('担当者','<select onchange="M.who=this.value">'+activeStaff().map(s=>'<option value="'+s.id+'"'+(M.who===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>') + '</div>' +
    f('区分','<div class="pick plain">'+ATD.map(t=>'<button type="button" class="'+(M.type===t?'on':'')+'" onclick="M.type=\''+t+'\';drawAtd()">'+t+'</button>').join('')+'</div>') +
    f('備考','<input value="'+esc(M.note)+'" oninput="M.note=this.value">'),
    '<div class="sp"></div><button class="btn" onclick="askClose()">キャンセル</button>' +
    '<button class="btn pri" onclick="saveAtd()">保存</button>');
}
function saveAtd(){
  const ex = DB.atd.find(a => a.date===M.date && a.who===M.who);
  if(ex) Object.assign(ex, M); else { M.id = uid('a'); DB.atd.push(M); }
  save(); closeM(); render(); toast('保存しました');
}

/* ============================================================
   はじめての設定（スマホ向けウィザード）
   ============================================================ */
function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(t){ try{ return JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/'))))); }catch(e){ return null; } }
/* 配布リンク（#setup=...）から同期設定を受け取る */
function applySetupLink(){
  const m = (location.hash||'').match(/setup=([A-Za-z0-9\-_]+)/);
  if(!m) return false;
  const c = b64d(m[1]);
  history.replaceState(null,'',location.pathname + location.search);
  if(!c || !c.u) return false;
  DB.cfg.gasUrl = c.u; DB.cfg.gasToken = c.t || '';
  let full = false;
  if(c.n && DB.staff.some(x => x.id === c.n && x.active !== false)){
    DB.cfg.actor = c.n; DB.cfg.me = c.n;
    DB.cfg.mode = (c.m === 'all' ? 'all' : 'me');
    DB.cfg.setupDone = true; DB.cfg.seen = true;
    full = true;                     // 名前まで入っている＝設定画面は出さない
  }
  save();
  return full ? 'done' : true;
}
function baseUrl(){ return location.origin + location.pathname; }
const INVM = {};                       /* リンクごとの表示のしかた */
const invMode = id => INVM[id] || ((id === 's1' || id === 's6') ? 'all' : 'me');
function invUrl(staffId){
  return baseUrl() + '#setup=' + b64e({u:DB.cfg.gasUrl||'', t:DB.cfg.gasToken||'',
    n:staffId||'', m:invMode(staffId)});
}
function setInvMode(id, v){
  INVM[id] = v;
  const el = document.getElementById('inv_'+id);
  if(el) el.value = invUrl(id);
}
function invLinks(){
  if(location.protocol === 'file:')
    return '<div class="hintline">※ このファイルをパソコンで直接開いているため、配れるリンクはまだ作れません。ネット上に置いたあと（社内の共有アドレス）に、この画面からリンクを作ってください。</div>';
  if(!DB.cfg.gasUrl)
    return '<div class="hintline">※ 先に上の「Apps Script の Web アプリ URL」と「合言葉」を入れてください。</div>';
  return '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">' + activeStaff().map(s0 =>
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<span style="min-width:74px;display:flex;align-items:center;gap:6px">'+avatar(s0)+esc(s0.name)+'</span>' +
      '<select onchange="setInvMode(\''+s0.id+'\',this.value)" style="padding:6px 6px;border:1px solid var(--line);border-radius:8px;font-size:12px">' +
        '<option value="me"'+(invMode(s0.id)==='me'?' selected':'')+'>自分の分だけ（現場）</option>' +
        '<option value="all"'+(invMode(s0.id)==='all'?' selected':'')+'>全員を見る（事務所）</option></select>' +
      '<input readonly id="inv_'+s0.id+'" value="'+esc(invUrl(s0.id))+'" onclick="this.select()" ' +
        'style="flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:11.5px">' +
      '<button class="btn sm" onclick="copyInv(\''+s0.id+'\')">コピー</button>' +
    '</div>').join('') + '</div>';
}
function copyInv(id){
  const el = document.getElementById('inv_'+id);
  if(!el) return;
  el.select(); el.setSelectionRange(0, 99999);
  try{ navigator.clipboard.writeText(el.value); toast('リンクをコピーしました'); }
  catch(e){ try{ document.execCommand('copy'); toast('リンクをコピーしました'); }catch(e2){ toast('長押しでコピーしてください'); } }
}
function makeSetupLink(){
  if(!DB.cfg.gasUrl){ alert('先に Apps Script のURLと合言葉を入力してください'); return; }
  const link = location.origin + location.pathname + '#setup=' + b64e({u:DB.cfg.gasUrl, t:DB.cfg.gasToken||''});
  const el = document.getElementById('shareLink');
  if(el){ el.value = link; el.select(); }
  try{ navigator.clipboard.writeText(link); toast('リンクをコピーしました'); }
  catch(e){ toast('下の欄をコピーしてください'); }
}
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent);
/* はじめての設定は「その端末で一度だけ」。閉じ方に関わらず二度と出さない */
const needSetup = () => !DB.cfg.seen;

let W = null;
function openWizard(){
  DB.cfg.seen = true; save();          /* 開いた時点で「見た」ことにする＝再読込で戻らない */
  W = {step: DB.cfg.gasUrl ? 2 : 1, url: DB.cfg.gasUrl||'', token: DB.cfg.gasToken||'',
       me: DB.cfg.actor||'', mode: DB.cfg.mode||'me', msg:''};
  drawWizard();
}
function drawWizard(){
  const steps = ['同期の設定','自分の名前','表示のしかた','完了'];
  const bar = '<div style="display:flex;gap:6px;margin-bottom:4px">' + steps.map((t,i) =>
    '<div style="flex:1;height:4px;border-radius:2px;background:'+(i < W.step ? 'var(--accent)' : 'var(--line)')+'"></div>').join('') +
    '</div><div class="hintline">ステップ '+W.step+' / 4　'+steps[W.step-1]+'</div>';

  let body = '', foot = '';
  if(W.step === 1){
    body = '<div class="hintline">事務所から届いた「同期リンク」をタップした場合、この欄はすでに入っています。空の場合だけ入力してください。</div>' +
      f('Apps Script の URL','<input value="'+esc(W.url)+'" placeholder="https://script.google.com/macros/s/.../exec" oninput="W.url=this.value.trim()">') +
      f('合言葉','<input value="'+esc(W.token)+'" oninput="W.token=this.value.trim()">') +
      (W.msg ? '<div class="hintline">'+W.msg+'</div>' : '') +
      '<button class="btn" onclick="wizTest()">接続を確認する</button>';
    foot = '<button class="btn gh" onclick="wizSkip()">あとで設定する</button><div class="sp"></div>' +
      '<button class="btn pri" onclick="wizNext()">次へ</button>';
  }else if(W.step === 2){
    body = '<div class="hintline">この端末を使う人を選んでください。入金や金額の変更は、この名前で記録に残ります。</div>' +
      '<div class="pick">' + activeStaff().map(s =>
        '<button type="button" class="'+(W.me===s.id?'on':'')+'" onclick="W.me=\''+s.id+'\';drawWizard()">' +
        avatar(s)+esc(s.full||s.name)+'</button>').join('') + '</div>';
    foot = '<button class="btn" onclick="W.step=1;drawWizard()">戻る</button><div class="sp"></div>' +
      '<button class="btn pri" onclick="wizNext()">次へ</button>';
  }else if(W.step === 3){
    body = '<div class="hintline">ふだんの見え方を選びます。あとから左上で切り替えられます。</div>' +
      '<div class="pick plain" style="flex-direction:column;align-items:stretch">' +
        '<button type="button" class="'+(W.mode==='me'?'on':'')+'" onclick="W.mode=\'me\';drawWizard()" style="text-align:left;padding:12px 14px">' +
          '<b>自分の予定だけ（現場向け・おすすめ）</b><br><span style="font-size:11.5px;opacity:.8">自分の1日の流れとToDoだけが出ます</span></button>' +
        '<button type="button" class="'+(W.mode==='all'?'on':'')+'" onclick="W.mode=\'all\';drawWizard()" style="text-align:left;padding:12px 14px">' +
          '<b>全員の予定（事務所向け）</b><br><span style="font-size:11.5px;opacity:.8">担当者ごとのボードと売掛会議を使います</span></button>' +
      '</div>';
    foot = '<button class="btn" onclick="W.step=2;drawWizard()">戻る</button><div class="sp"></div>' +
      '<button class="btn pri" onclick="wizNext()">次へ</button>';
  }else{
    body = '<div class="sec"><h4>ホーム画面に追加しておくと便利です</h4>' +
      (isIOS()
        ? '<div style="font-size:13px;line-height:1.9">① 画面下の<b>共有ボタン</b>（□に↑）をタップ<br>② <b>「ホーム画面に追加」</b>をタップ<br>③ 名前を「金剛住機」にして<b>追加</b></div>'
        : '<div style="font-size:13px;line-height:1.9">① 右上の<b>「⋮」</b>をタップ<br>② <b>「ホーム画面に追加」</b>をタップ<br>③ 名前を「金剛住機」にして<b>追加</b></div>') +
      '<div class="hintline">次からはアイコンをタップするだけで開けます。</div></div>' +
      '<div class="sec"><h4>設定内容</h4><div style="font-size:13px;line-height:1.8">' +
        '操作者：<b>'+esc((staffById(W.me)||{}).full||(staffById(W.me)||{}).name||'未設定')+'</b><br>' +
        '表示：<b>'+(W.mode==='me'?'自分の予定だけ':'全員の予定')+'</b><br>' +
        '同期：<b>'+(W.url?'設定済み':'未設定')+'</b></div></div>';
    foot = '<button class="btn" onclick="W.step=3;drawWizard()">戻る</button><div class="sp"></div>' +
      '<button class="btn pri" onclick="wizDone()">はじめる</button>';
  }
  shell('はじめての設定', bar + body, foot);
}
function wizTest(){
  const msg = v => { W.msg = v; drawWizard(); };
  if(!W.url){ msg('<span style="color:var(--danger)">URLを入力してください</span>'); return; }
  const keepU = DB.cfg.gasUrl, keepT = DB.cfg.gasToken;
  DB.cfg.gasUrl = W.url; DB.cfg.gasToken = W.token;
  msg('確認中…');
  Sync.call('pull').then(r => {
    if(r.ok) msg('<span style="color:var(--ok)">つながりました。次へ進んでください。</span>');
    else { DB.cfg.gasUrl = keepU; DB.cfg.gasToken = keepT;
      msg('<span style="color:var(--danger)">'+esc(r.error||'エラー')+'</span>'); }
  }).catch(e => { DB.cfg.gasUrl = keepU; DB.cfg.gasToken = keepT;
    msg('<span style="color:var(--danger)">'+esc(e.message)+'</span>'); });
}
function wizNext(){
  if(W.step === 1){ DB.cfg.gasUrl = W.url; DB.cfg.gasToken = W.token; save(); }
  if(W.step === 2 && !W.me){ alert('名前を選んでください'); return; }
  W.step++; drawWizard();
}
function wizSkip(){
  DB.cfg.setupDone = true; DB.cfg.seen = true;
  if(!DB.cfg.actor) setActorDefault();
  save(); closeM(); render();
}
/* 名前を選ばずに閉じても困らないよう、操作者は自動で決めておく（左下でいつでも変更可） */
function setActorDefault(){
  const a = activeStaff()[0];
  if(a){ DB.cfg.actor = a.id; DB.cfg.me = DB.cfg.me || a.id; }
}
function wizDone(){
  DB.cfg.actor = W.me; S.me = W.me; DB.cfg.me = W.me;
  DB.cfg.mode = W.mode; S.mode = W.mode;
  DB.cfg.gasUrl = W.url; DB.cfg.gasToken = W.token; DB.cfg.setupDone = true; DB.cfg.seen = true;
  save(); closeM(); render(); startAutoSync();
  toast('設定が完了しました');
}

/* ============================================================
   アプリの自動更新（社員は何も設定し直さなくてよい）
   ・置いてあるファイルが新しくなったら、下に「更新する」ボタンを出す
   ・保存してある予定・ToDo・名前・同期設定はそのまま残る
   ============================================================ */
const APP_VER = '2.7';
let NEWVER = '';
function paintUpd(){
  let el = document.getElementById('updbar');
  if(!NEWVER){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id = 'updbar'; el.className = 'updbar'; document.body.appendChild(el); }
  el.innerHTML = '<span>新しいバージョン（v'+esc(NEWVER)+'）が出ています。入力した内容はそのまま残ります。</span>' +
    '<button class="btn sm" onclick="doUpdate()">更新する</button>' +
    '<button class="btn sm gh" onclick="NEWVER=\'\';paintUpd()">あとで</button>';
  const hb = document.getElementById('synchint'); if(hb) hb.style.bottom = '74px';
}
function paintHint(){
  let el = document.getElementById('synchint');
  const show = !DB.cfg.gasUrl && !DB.cfg.hintOff;
  if(!show){ if(el){ el.remove(); document.body.style.paddingBottom = ''; } return; }
  if(!el){ el = document.createElement('div'); el.id = 'synchint'; el.className = 'hintbar'; document.body.appendChild(el); }
  document.body.style.paddingBottom = '74px';
  el.innerHTML =
    '<span>この端末を使う人：</span>' +
    '<select onchange="setActor(this.value)" style="padding:5px 7px;border:1px solid var(--line);border-radius:8px">' +
      activeStaff().map(x => '<option value="'+x.id+'"'+(actor()===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('') +
    '</select>' +
    '<span style="opacity:.85">同期の設定はまだです（<b>この端末の中だけ</b>に保存中）</span>' +
    '<button class="btn sm pri" onclick="openWizard()">設定する</button>' +
    '<button class="btn sm" onclick="DB.cfg.hintOff=true;save();paintHint()">閉じる</button>';
  el.style.bottom = document.getElementById('updbar') ? '74px' : '12px';
}
function doUpdate(){
  try{ save(); }catch(e){}
  location.replace(baseUrl() + '?v=' + Date.now());
}
async function checkUpdate(){
  if(location.protocol === 'file:') return;
  try{
    const r = await fetch(baseUrl() + '?_c=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const t = await r.text();
    const m = t.match(/APP_VER\s*=\s*'([^']+)'/);
    if(m && m[1] !== APP_VER){ NEWVER = m[1]; paintUpd(); }
  }catch(e){}
}

/* ---------- 起動 ---------- */
/* 更新後にURLへ付いた ?v=… を消して、いつも同じアドレスに保つ */
if(location.search && /[?&](v|_c)=/.test(location.search))
  try{ history.replaceState(null, '', location.pathname + location.hash); }catch(e){}
purgeOld();
const fromLink = applySetupLink();
if(!DB.cfg.actor) setActorDefault();   /* 名前を選ばなくても、そのまま使える */
save();          // 初回に更新時刻の基準を作る
S.mode = DB.cfg.mode || 'all';
S.me   = DB.cfg.me || (activeStaff()[0]||{}).id || '';
render();
startAutoSync();
paintSync();
refreshNotes();
paintHint();
if(fromLink === 'done'){ DB.cfg.seen = true; save(); setTimeout(() => toast('設定が完了しました。そのままお使いいただけます'), 500); }
else if(fromLink) setTimeout(openWizard, 400);   /* 名前なしの招待リンクのときだけ */
setTimeout(checkUpdate, 4000);
setInterval(checkUpdate, 15 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(); });
</script>
